<!doctype html>
<html lang="en" data-air="off">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Radio Change</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Martian+Mono:wdth,wght@75..112.5,100..800&display=swap" rel="stylesheet" />
<style>
  :root{
    /* the colours are set by the script, from the vibe on show (see VIBES); these are the station's own */
    --ink:#1C0836;--cream:#FFF3DC;--amber:#FFC93C;--live:#FF4A3A;--pick:#E81E8C;--d1:#2A1AA0;--d2:#B0126F;
    --pad:clamp(14px,2.2vw,34px);
    --gap:clamp(14px,2vw,30px);
    --bar:clamp(48px,6.6vh,60px);
    --side:clamp(190px,23vw,330px);
    --volw:44px;
    /* the strip the volume stands in; the ten EQ bands take the rest of the width */
    --gut:calc(var(--pad) + var(--volw) + var(--gap)/2);
    --gl:var(--gut);--gr:0px;
    /* The strip runs from the page's edge to halfway across the gap, so its
       middle is not the middle of the volume's column. This is how far the
       volume moves to stand there. */
    --volx:calc(var(--gap)/4 - var(--pad)/2);
    --ease:cubic-bezier(.7,0,.15,1);
    --mono:"Martian Mono",ui-monospace,Consolas,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  /* The page is one screen and never scrolls. On a phone that has to be said
     three ways: nothing for the document to scroll to, no rubber band past its
     ends, and the page itself pinned to the screen, so it fills whatever the
     browser's bars leave it and stays put under a dragging finger. */
  html{height:100%;overflow:hidden;overscroll-behavior:none;background:var(--ink)}
  body{
    background:var(--ink);color:var(--cream);
    font-family:Archivo,"Arial Narrow",Impact,sans-serif;font-stretch:100%;
    position:fixed;inset:0;overflow:hidden;overscroll-behavior:none;touch-action:pinch-zoom;padding:var(--pad);
    display:grid;column-gap:var(--gap);
    grid-template-columns:var(--volw) minmax(0,1fr) var(--side);
    grid-template-rows:auto minmax(0,1fr) auto;
    -webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none;
  }
  canvas#c{position:absolute;inset:0;width:100%;height:100%;display:block;z-index:0;
    background:linear-gradient(140deg,var(--ink),var(--d1) 55%,var(--d2))}

  header,#block,#side,#vol,footer{position:relative;z-index:2}
  header,#block,#side,footer{pointer-events:none}
  .hit{pointer-events:auto}
  .pill{background:var(--ink);border-radius:999px}
  .lab{font-weight:800;font-stretch:112%;font-size:10px;letter-spacing:.18em;text-transform:uppercase}

  header{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;column-gap:10px;
    padding-bottom:calc(var(--pad)*.5);min-height:calc(var(--pad)*.5 + 30px)}
  /* The name is the station's sticker, a picture: black paint on a backing cut
     to its shape. Its height and width are given here, so the header is the
     same size before the picture arrives as after, and it reaches a little past
     the row, above and below. Squeezed, it is drawn smaller. The hard shadow is
     the one the name had as letters, made here and not in the picture, so it
     takes the colour of the vibe on show. */
  .wm{--h:clamp(41px,4.05vw,55px);display:flex;align-items:center;flex:none;height:var(--h);width:calc(var(--h)*685/143);
    min-width:0;max-width:100%;margin:calc(var(--h)*-.12) 0;
    filter:drop-shadow(calc(var(--h)*.055) calc(var(--h)*.055) 0 var(--ink))}
  .foil{position:relative;width:100%;aspect-ratio:685/143;overflow:hidden}
  .foil img{position:relative;z-index:1;display:block;width:100%;height:100%}
  /* The holographic foil edition. The picture is the sticker on white, and here
     its white becomes foil: behind the picture a pale spectrum, leaning, drifts
     across without end, and now and then a band of light crosses it. The picture
     lies over them so that its white takes their colour and its black stays
     black, and all of it is cut to the sticker's shape. A browser that cannot
     cut a shape shows the white sticker. */
  @supports ((-webkit-mask-image:none) or (mask-image:none)){
    .foil{-webkit-mask:url(radio-change-logo.png?v=2) center/100% 100% no-repeat;mask:url(radio-change-logo.png?v=2) center/100% 100% no-repeat}
    .foil img{mix-blend-mode:multiply}
    .foil::before,.foil::after{content:"";position:absolute;top:0;bottom:0;will-change:transform}
    /* the spectrum, one sticker wide and ending on the colour it began with, laid end to end */
    .foil::before{left:-120%;right:-120%;transform:skewX(-18deg);
      background:linear-gradient(90deg,#a3aef0,#95bdf2 10%,#82d2f5 20%,#7de8f9 29%,#95f9f0 38%,#b2fcd3 47%,#d4fac4 55%,#fbeeb2 63%,#fad0a1 72%,#f7b3a8 81%,#f3a6c4 90%,#d2a8ee 96%,#a3aef0) 0 0/calc(100%/3.4) 100% repeat-x;
      animation:foil 16s linear infinite}
    .foil::after{left:-60%;right:-60%;
      background:linear-gradient(105deg,transparent 43%,rgba(255,255,255,.45) 49%,rgba(255,255,255,.15) 53%,transparent 59%);
      animation:glint 9s ease-in-out infinite}
  }
  @keyframes foil{from{transform:translateX(0) skewX(-18deg)}to{transform:translateX(calc(100%/3.4)) skewX(-18deg)}}
  @keyframes glint{0%{transform:translateX(-75%)}55%,100%{transform:translateX(75%)}}
  @media (prefers-reduced-motion:reduce){.foil::before,.foil::after{animation:none}}
  .st{display:flex;align-items:center;gap:.7em;padding:.75em 1.1em}
  .st i{width:.9em;height:.9em;border-radius:50%;background:var(--cream);opacity:.4}
  [data-air=on] .st i{background:var(--live);opacity:1}
  [data-air=dialing] .st i{opacity:1;animation:blink .35s steps(2,jump-none) infinite}
  body.quiet .st i{background:var(--amber);opacity:1}
  @keyframes blink{50%{opacity:.25}}

  /* ---------- the vibe: a slider through the page's colours ----------
     A plain rail with a notch for every vibe, the brightest on the left and
     the blackest on the right. It shows no colours of its own: the page does
     that. The knob always comes to rest on a notch. */
  #vibe{display:flex;align-items:center;gap:.6em;padding:5px 8px 5px 1.4em;margin:0 auto 0 clamp(12px,2vw,28px);
    cursor:ew-resize;touch-action:none;outline:0}
  #vibe:focus-visible{box-shadow:0 0 0 2px var(--amber)}
  #vibe .run{position:relative;width:clamp(170px,20vw,260px);height:20px}
  /* the notches, and the line from the first of them to the last */
  #vibe .run::before{content:"";position:absolute;left:0;right:0;top:50%;height:6px;margin-top:-3px;opacity:.45;
    background:radial-gradient(circle closest-side,var(--cream) 99%,transparent) 0 0/calc(100%/var(--n,1)) 100%,
      linear-gradient(var(--cream),var(--cream)) center/calc(100% - 100%/var(--n,1)) 2px no-repeat}
  #vibe .run b{position:absolute;top:50%;left:calc((var(--x,0) + .5)/var(--n,1)*100%);width:18px;height:18px;margin:-9px 0 0 -9px;
    border-radius:50%;background:var(--amber);box-shadow:0 0 0 3px var(--ink);transition:left .22s cubic-bezier(.3,.7,.3,1)}
  #vibe.drag .run b{transition:none}             /* a drag stays under the finger */

  /* ---------- the song: every line set edge to edge ---------- */
  #block{grid-column:2;grid-row:2;min-height:0;display:flex;flex-direction:column;justify-content:flex-end;
    transition:opacity .25s}
  #block.out{opacity:0}
  .ln{position:relative;width:max-content;white-space:nowrap;font-weight:900;line-height:.78;
    clip-path:inset(-25% 100% -25% 0);
    animation:wipe .6s var(--ease) forwards;animation-delay:calc(var(--i)*70ms)}
  #block.still .ln{animation:none;clip-path:none}
  @keyframes wipe{to{clip-path:inset(-25% -6% -25% -2%)}}
  /* artist: cream with a hard ink edge. title: ink with a cream outline.
     Each carries its own light and dark, so both read on any colour behind. */
  .ln.a{color:var(--cream);text-shadow:.03em .03em 0 var(--ink)}
  .ln.t{color:var(--ink);-webkit-text-stroke:.04em var(--cream);paint-order:stroke fill}
  /* Brackets are drawn taller than the capitals, above them and below the line,
     and lines set this tight have no room for that: a size down and lifted, they
     stand as tall as a round letter. The fitting counts on this size (see BRS). */
  .br{font-size:.8em;position:relative;bottom:.14em}
  /* The song can be selected and copied. Its highlight is not a box of colour:
     the field itself runs fast and fine behind whatever is selected (see the
     shader), so here the letters only need to keep their own look. */
  #block{pointer-events:auto}
  .ln{user-select:text;-webkit-user-select:text;cursor:text}
  .ln.a::selection,.ln.a .br::selection{background:transparent;color:var(--cream);text-shadow:.03em .03em 0 var(--ink)}
  .ln.t::selection,.ln.t .br::selection{background:transparent;color:var(--ink);-webkit-text-stroke:.04em var(--cream)}
  body.nogl .ln::selection,body.nogl .ln .br::selection{background:var(--pick)}        /* no field to draw it: a plain hot highlight */
  /* the small titles can be selected too */
  ::selection{background:var(--amber);color:var(--ink)}
  #hist li,#np{pointer-events:auto;user-select:text;-webkit-user-select:text;cursor:text}

  /* ---------- right: the cover, and under it the last songs played ---------- */
  #side{grid-column:3;grid-row:2;min-height:0;display:flex;flex-direction:column;gap:12px;overflow:hidden;
    padding:24px 9px 9px 0;margin-top:-24px;transition:opacity .25s}
  .art{--r:16px;--sh:8px;position:relative;flex:none;width:min(100%,38vh);aspect-ratio:1;border-radius:var(--r);overflow:hidden;
    background:var(--ink);box-shadow:var(--sh) var(--sh) 0 var(--ink);container-type:inline-size}
  .art .ph,#actArt .ph{position:absolute;inset:0;display:grid;place-items:center;background:var(--b,#5B2BE0);color:var(--f,#FFE9C9);
    font-weight:900;font-stretch:125%;font-size:62cqw;line-height:1;text-transform:uppercase}
  .art img,#actArt img{position:absolute;object-fit:cover}
  /* A cover that came with an outline of its own is shown a little bigger than
     its slot, and moved, so that the outline falls outside (see outline, in the
     script): --s is its size, and --x and --y how far its corner sits to the
     left of the slot's and above it, all in hundredths of the slot's width.
     Any other cover fills its slot exactly, as do the small ones in the list. */
  .art img,#actArt img,#hist .th img{left:calc(var(--x,0)*-1%);top:calc(var(--y,0)*-1%);width:calc(var(--s,100)*1%);height:calc(var(--s,100)*1%)}
  /* A face is what the cover slot shows: the sleeve, or a flat tile with an initial.
     A change of face is a flip. The cover turns side to side like a card on a
     pin through its top and bottom, old on one face and new on the other, to
     come to rest on the new one. How it moves (how far round, the pace, the
     easing, the depth) is set in the script, next to the code that runs it. */
  .face,.flip{position:absolute;inset:0}
  .flip{pointer-events:none;transform-style:preserve-3d;will-change:transform}
  /* while it turns, the card carries its own corners and shadow, and the slot shows nothing of its own */
  .art.flipping{overflow:visible;background:none;box-shadow:none;z-index:1}
  .art.flipping #faceNow{visibility:hidden}
  .side{position:absolute;inset:0;border-radius:var(--r);overflow:hidden;background:var(--ink);
    box-shadow:var(--sh) var(--sh) 0 var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden}
  .side.back{transform:rotateY(180deg)}
  .jp{flex:none;align-self:flex-start;color:var(--amber);padding:.6em .9em;margin-top:2px}
  .jp:has(+ #hist:empty){display:none}
  #hist{position:relative;list-style:none;display:flex;flex-direction:column;gap:7px;min-height:0}
  #hist li{flex:none;display:flex;align-items:center;gap:10px;min-width:0;
    background:var(--ink);border-radius:14px;padding:6px 14px 6px 6px}
  /* A row's picture turns over as the cover does, and its back is never seen.
     The ghost is what the row held before: the old picture and words, standing
     over the same slot with no pill of their own, for the first half of the turn. */
  #hist .th{backface-visibility:hidden;-webkit-backface-visibility:hidden}
  #hist li.ghost{position:absolute;left:0;right:0;pointer-events:none;background:none}
  #hist .th{position:relative;flex:none;width:38px;height:38px;border-radius:9px;overflow:hidden;
    background:var(--b);color:var(--f);display:grid;place-items:center;font-weight:900;font-size:19px;text-transform:uppercase}
  #hist .th img{position:absolute;object-fit:cover;opacity:0;transition:opacity .4s}
  #hist .th img.on{opacity:1}
  #hist .tx{min-width:0}
  #hist b,#hist span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #hist b{font-weight:800;font-stretch:92%;font-size:13px;line-height:1.15}
  #hist span{font-weight:500;font-size:12px;line-height:1.2;opacity:.8}

  /* ---------- the volume fader ---------- */
  .trk{position:relative;flex:1;width:18px;min-height:70px;border-radius:9px;background:var(--ink)}
  .trk i{position:absolute;left:4px;right:4px;border-radius:5px;background:var(--cream)}
  .trk b{position:absolute;left:50%;width:30px;height:30px;margin-left:-15px;border-radius:50%;
    background:var(--amber);box-shadow:3px 3px 0 var(--ink)}
  .num{min-width:40px;text-align:center;padding:.7em .5em;font-size:11px;letter-spacing:.06em}

  /* volume: upright, the wheel moves it from anywhere, mute sits at its foot */
  #vol{grid-column:1;grid-row:2/4;left:var(--volx);display:flex;flex-direction:column;align-items:center;gap:10px}
  .fader{flex:1;min-height:0;width:100%;display:flex;flex-direction:column;align-items:center;gap:10px;
    cursor:ns-resize;touch-action:none}
  .fader .trk{max-height:58vh;margin-top:auto}
  .fader .trk i{bottom:4px;height:calc((100% - 8px)*var(--v,.8))}
  .fader .trk b{bottom:calc((100% - 30px)*var(--v,.8))}
  body.quiet .fader .trk i{opacity:.35}
  /* a jump (mute, or a press far along the track) glides; a drag stays under the finger */
  .fader.glide .trk i{transition:height .22s cubic-bezier(.3,.7,.3,1)}
  .fader.glide .trk b{transition:bottom .22s cubic-bezier(.3,.7,.3,1)}
  #mute{position:relative;flex:none;width:var(--bar);height:var(--bar);border:0;background:none;padding:0;cursor:pointer;
    color:var(--ink);display:grid;place-items:center}
  #mute svg{grid-area:1/1}
  #blob{width:100%;height:100%;overflow:visible}
  #blob .sh{fill:var(--ink)}
  #blob .bd{fill:var(--cream);transition:fill .25s}
  #mute:hover .bd{fill:#fff}
  body.quiet #blob .bd{fill:var(--amber)}
  .ic{width:50%;height:50%;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
  .ic .f{fill:currentColor}
  .i-off{display:none}
  body.quiet .i-on{display:none}
  body.quiet .i-off{display:block}
  /* waiting for the first touch: the button breathes, nothing radiates */
  [data-air=blocked] #mute{animation:breathe .8s ease-in-out infinite alternate}
  @keyframes breathe{to{transform:scale(1.14)}}

  /* ---------- footer: presets, and the way into the equaliser ---------- */
  footer{grid-column:2/4;grid-row:3;display:flex;align-items:center;gap:8px;min-width:0;min-height:var(--bar);
    margin-top:calc(var(--pad)*.7)}
  #presets{display:flex;gap:7px;flex-wrap:wrap}
  #presets button{font:inherit;font-weight:800;font-stretch:100%;font-size:11px;letter-spacing:.12em;cursor:pointer;
    background:var(--ink);color:var(--cream);border:0;border-radius:999px;padding:.95em 1.25em;white-space:nowrap}
  #presets button:hover{color:var(--amber)}
  #presets button.act{background:var(--cream);color:var(--ink)}
  #presets button.eq{display:flex;align-items:center;gap:.7em}
  #presets button.eq svg{width:1.25em;height:1.25em;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round}
  body.desk #presets button.eq{background:var(--amber);color:var(--ink)}
  .hint{display:none;padding:.7em 1em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;
    font-family:var(--mono);font-weight:600;font-stretch:87.5%;font-size:11px;letter-spacing:0;text-transform:none}
  body.desk .hint{display:block}
  /* Shown only while the browser is holding the sound back. It stands where the
     presets are, beside the mute button, and they wait behind it: they shape a
     sound that is not on yet. It takes no room of its own. When it did, the
     presets made way for it, the song above was set for a shorter page until
     the first touch, and set again the moment the cue went. */
  #cue{display:none;position:absolute;left:0;top:50%;transform:translateY(-50%);background:var(--cream);color:var(--ink);
    padding:1em 1.4em;font-size:12px;letter-spacing:.12em;white-space:nowrap}
  [data-air=blocked] #cue{display:block}
  [data-air=blocked] #presets{visibility:hidden}

  /* ---------- the equaliser: the ten columns of the field are the sliders ---------- */
  #cols{position:absolute;z-index:3;top:0;bottom:0;left:var(--gl);right:var(--gr);
    display:flex;opacity:0;visibility:hidden;transition:opacity .25s,visibility 0s .25s}
  body.desk #cols{opacity:1;visibility:visible;transition:opacity .25s}
  body.desk #block,body.desk #side{opacity:0;visibility:hidden}
  body.desk header,body.desk footer{z-index:4}        /* keep the presets clickable over the faders */
  /* The test card's slider, as it was: no track and no knob. The bar is the
     slider, with one plain line across it where the band is set and a small tag
     over the line. It works because the bar under it is one flat colour. */
  .col{position:relative;flex:1;min-width:0;cursor:ns-resize;touch-action:none}
  .gain{position:absolute;left:0;right:0;height:4px;margin-top:-2px;background:var(--cream);
    top:calc(50% - var(--g,0)*30%);pointer-events:none}
  /* Read-outs are set in the test card's own face, a monospace: figures line up,
     the zero is unmistakable, and the tag can hug its text. Every band shows its
     value, flat ones included. */
  .tag{position:absolute;left:50%;transform:translateX(-50%);white-space:nowrap;pointer-events:none;
    border-radius:2px;padding:3px 5px;font-family:var(--mono);font-weight:700;font-stretch:87.5%;
    font-size:11px;line-height:1.1;letter-spacing:0;text-transform:none}
  .gain .tag{bottom:8px;background:var(--cream);color:var(--ink);transition:background-color .15s}
  .col.drag .gain .tag{background:var(--amber)}
  .hz{bottom:calc(var(--pad)*1.7 + var(--bar) - 2px);background:var(--ink);color:var(--cream)}
  /* the song steps up into the header while the equaliser has the page */
  #np{display:none;min-width:0;max-width:52%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    padding:.75em 1.2em;font-weight:700;font-stretch:100%;font-size:13px;line-height:1}
  body.desk #np{display:block}

  /* where type is measured, never seen. Fixed, because a song set this big is
     far wider than a phone, and a phone will zoom out to anything the page is
     wide enough to scroll to. */
  /* ---------- the song elsewhere: what a click or a tap on a song brings up ---------- */
  #hist li,.art{cursor:pointer}
  .art{pointer-events:auto}
  /* a card: the song's picture, and beside it the four ways out, in a column as tall as the picture */
  #act{--row:34px;--sp:6px;position:fixed;z-index:8;left:0;top:0;display:flex;gap:8px;padding:8px;
    max-width:calc(100vw - 20px);background:var(--cream);border-radius:22px;box-shadow:6px 6px 0 var(--ink)}
  #act[hidden]{display:none}
  #actArt{position:relative;flex:none;width:calc(var(--row)*4 + var(--sp)*3);aspect-ratio:1;border-radius:15px;overflow:hidden;
    background:var(--ink);container-type:inline-size}
  #act .ways{display:flex;flex-direction:column;gap:var(--sp);min-width:136px}
  #act a,#act button{display:flex;align-items:center;height:var(--row);padding:0 1.5em;
    font:inherit;font-weight:800;font-stretch:100%;font-size:11px;letter-spacing:.12em;
    text-transform:uppercase;text-decoration:none;white-space:nowrap;cursor:pointer;
    background:var(--ink);color:var(--cream);border:0;border-radius:999px}
  #act a:hover,#act button:hover{color:var(--amber)}
  #act button.done{background:var(--amber);color:var(--ink)}
  /* the row it was brought up for, lit the way the chosen preset is */
  #hist li.picked{background:var(--cream);color:var(--ink)}
  #measure{position:fixed;left:0;top:0;visibility:hidden;white-space:nowrap;
    font-size:100px;font-weight:900;line-height:1;pointer-events:none}
  #err{position:fixed;z-index:9;left:50%;top:var(--pad);transform:translateX(-50%);display:none;
    background:var(--amber);color:var(--ink);padding:.8em 1.2em;border-radius:999px;font-weight:800;font-size:12px;letter-spacing:.08em}

  /* a phone: the volume moves to the right */
  @media (max-width:760px){
    :root{--volw:40px;--gl:0px;--gr:var(--gut);--volx:calc(var(--pad)/2 - var(--gap)/4)}
    body{grid-template-columns:minmax(0,1fr) var(--volw);grid-template-rows:auto minmax(0,1fr) auto auto;row-gap:12px}
    /* The name and the light share a row, and it is a grid, so that it stays one
       row whatever the light says. When the two could wrap, they did on a narrow
       phone, or one set to large type, for the second the light says
       "Connecting": the header grew, the song under it was set smaller, and then
       back again. Should the two ever not fit, the name is drawn smaller. */
    header{display:grid;grid-template-columns:minmax(0,1fr) auto;padding-bottom:0;row-gap:8px}
    .st{grid-area:1/2}
    /* no room beside the name here: the vibe takes a row of its own under it */
    #vibe{grid-area:2/1/auto/-1;margin:0;padding:8px 10px 8px 1.4em}
    #vibe .run{flex:1;width:auto}
    #block{grid-column:1}
    #side{grid-column:1;grid-row:3;display:grid;grid-template-columns:108px minmax(0,1fr);gap:10px;align-items:start}
    .art{--r:12px;--sh:5px;width:108px}
    .jp{display:none}
    #hist{max-height:108px}
    #vol{grid-column:2;grid-row:2/5}
    footer{grid-column:1;grid-row:4;margin-top:0;flex-wrap:wrap}
    #presets{gap:5px}

<script>
/* =====================================================================
   RADIO CHANGE
     ground   big flat fluid shapes; hot when sound is running, dusk when not.
              Ten columns are lit to each EQ band's level, and one more, behind
              the volume fader, to the level going out
     vibe     the colours of all of it, on a slider in the header: from the
              brightest, by way of the warm ones, to the dark
     song     artist and title stretched edge to edge, cover, last songs played
     sound    no play button: the page goes on air by itself (or on the first
              touch, where the browser insists), and there is only mute
     EQ       presets in the footer; CUSTOM EQ settles the field into ten flat
              bars, the test card's way: each bar is its own slider, with one line
              across it where the band is set
   ===================================================================== */
const $=s=>document.querySelector(s);
const block=$("#block"),meas=$("#measure"),cv=$("#c"),muteBtn=$("#mute");

/* ================= the vibe =================
   Everything coloured on the page comes from one of these. The slider in the
   header runs through them in this order: the brightest first, then the warm
   ones, then the dark, and the blackest last. CHANGE is the station's own, and
   where a first visit starts.
     hot    the field's seven colours when sound is running (ink is the eighth)
     dusk   the three it falls back to when there is none

const VIBES=[

    bar:["#E2A62E","#D97F24","#D0561C","#C03524","#B0182E","#9D1640","#8A1552","#6A166B","#4A1784","#1D2173"]},
  /* blood and rust: reds from fresh to dried on black, with one streak of rust */
  {id:"blood",name:"Blood",ink:"#0B0406",cream:"#F2E6D8",amber:"#E0862E",live:"#D4202F",
    hot:["#8E0F1F","#D4202F","#5E0A14","#B5461C","#3A0A10","#6B1230","#2A2226"],
    dusk:["#3A070E","#1E1719","#4A0C1E"],
    bar:["#E0862E","#C8641F","#B5461C","#C22F22","#D4202F","#B0182A","#8E0F1F","#741024","#5E0A14","#3A0A10"]},
  /* slow and heavy: moss, pine and petrol under a purple haze, lit by a sick green */
  {id:"doom",name:"Doom",ink:"#070A08",cream:"#EDE9D6",amber:"#A9C92B",live:"#D4432A",
    hot:["#2E5E2A","#7FAE1C","#1C3A2A","#4A1E66","#7A6A14","#14302E","#6A2A9A"],
    dusk:["#14261A","#24123A","#0F2424"],
    bar:["#A9C92B","#86AE24","#5F8F24","#3F7528","#2E5E2A","#1E4A38","#1A3A4E","#2E2466","#4A1E66","#6A2A9A"]},
  /* lights out: charcoal, gunmetal and cold steel, and a single line of red */
  {id:"blackout",name:"Blackout",ink:"#050507",cream:"#E9E6E2",amber:"#BFC4D4",live:"#E0263A",
    hot:["#B3122A","#23242E","#34374A","#15161C","#4B5470","#5A0C18","#1C2238"],
    dusk:["#191A22","#2A0A10","#1A2030"],
    bar:["#B3122A","#8E1024","#6A0E1E","#4A1220","#34202E","#2E2A3E","#34374A","#3F465E","#4B5470","#5E6A8C"]},

const HOME="change";
const rgb=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16)/255);
const hex=c=>"#"+c.map(v=>Math.round(v*255).toString(16).padStart(2,"0")).join("");
const light=h=>{const c=rgb(h);return .299*c[0]+.587*c[1]+.114*c[2];};
const CSSV=["ink","cream","amber","live","pick","d1","d2"];
VIBES.forEach(v=>{
  const d=v.dusk,f=list=>Float32Array.from(list.flatMap(rgb));
  if(!v.tiles)v.tiles=v.hot.map(c=>[c,light(c)>.4?v.ink:v.cream]).concat([[d[0],v.amber]]);
  /* the same colours as the shader takes them, and as the stylesheet does */
  v.f={ink:f([v.ink]),hot:f([v.ink].concat(v.hot)),dusk:f([v.ink,d[0],d[1],d[0],v.ink,d[2],d[1],d[0]]),bar:f(v.bar)};
  v.css=[v.ink,v.cream,v.amber,v.live,v.hot[3],d[0],d[1]].map(rgb);
});
/* what the shader is drawing with, and what it is on its way to: a change of vibe runs in, it does not cut */
const field={ink:new Float32Array(3),hot:new Float32Array(24),dusk:new Float32Array(24),bar:new Float32Array(30)};
const fieldTo={ink:new Float32Array(3),hot:new Float32Array(24),dusk:new Float32Array(24),bar:new Float32Array(30)};
const vibeEl=$("#vibe"),runEl=vibeEl.querySelector(".run");
let vibe=null,vibeAt=0;

/* flat stand-in for a missing cover: two colours and an initial, from the vibe on show */
function tileFor(text){
  let h=0;for(const c of text)h=(h*31+c.codePointAt(0))>>>0;
  return vibe.tiles[h%vibe.tiles.length];
}
function paintTile(el){
  const t=tileFor(el.dataset.tile);
  el.style.setProperty("--b",t[0]);el.style.setProperty("--f",t[1]);
}
/* x is a place on the slider. A whole number is a vibe; anything between two
   is a mix of them, which is what a drag passes through on its way. */
function setVibe(x,cut){
  const n=VIBES.length;
  vibeAt=Math.max(0,Math.min(n-1,x));
  const i=Math.min(n-2,Math.floor(vibeAt)),t=vibeAt-i,a=VIBES[i],b=VIBES[i+1];
  for(const k in field){
    const to=fieldTo[k],p=a.f[k],q=b.f[k];
    for(let j=0;j<to.length;j++)to[j]=p[j]+(q[j]-p[j])*t;
    if(cut)field[k].set(to);
  }
  const css=document.documentElement.style;
  CSSV.forEach((name,j)=>css.setProperty("--"+name,hex(a.css[j].map((c,m)=>c+(b.css[j][m]-c)*t))));
  runEl.style.setProperty("--x",vibeAt.toFixed(3));
  const near=VIBES[Math.round(vibeAt)];
  if(near===vibe)return;
  vibe=near;
  vibeEl.setAttribute("aria-valuenow",VIBES.indexOf(vibe));vibeEl.setAttribute("aria-valuetext",vibe.name);
  document.querySelectorAll("[data-tile]").forEach(paintTile);
}
/* the slider only ever rests on a vibe, and that one is kept for the next visit */
function restVibe(x){
  setVibe(Math.round(x));
  try{localStorage.setItem("radiochange.vibe",vibe.id);}catch(e){}
}
runEl.style.setProperty("--n",VIBES.length);
vibeEl.setAttribute("aria-valuemin",0);vibeEl.setAttribute("aria-valuemax",VIBES.length-1);
vibeEl.addEventListener("pointerdown",e=>{
  const r=runEl.getBoundingClientRect();
  if(e.clientX<r.left-8||e.clientX>r.right+8)return;     // the label is not part of the run
  vibeEl.setPointerCapture(e.pointerId);vibeEl.classList.add("drag");
  const at=ev=>setVibe((ev.clientX-r.left)/r.width*VIBES.length-.5);
  at(e);
  const up=()=>{
    vibeEl.classList.remove("drag");restVibe(vibeAt);
    ["pointermove","pointerup","pointercancel"].forEach((t,j)=>vibeEl.removeEventListener(t,j?up:at));
  };
  ["pointermove","pointerup","pointercancel"].forEach((t,j)=>vibeEl.addEventListener(t,j?up:at));
});
vibeEl.addEventListener("keydown",e=>{
  const step={ArrowLeft:-1,ArrowRight:1}[e.key];
  if(step){e.preventDefault();restVibe(Math.round(vibeAt)+step);}
});
{
  let id=null;
  try{id=localStorage.getItem("radiochange.vibe");}catch(e){}
  setVibe(VIBES.findIndex(v=>v.id===(VIBES.some(w=>w.id===id)?id:HOME)),true);
}

/* ================= the ground ================= */
const gl=cv.getContext("webgl2",{antialias:false,alpha:false,powerPreference:"high-performance"});
const VERT=`#version 300 es
in vec2 p;void main(){gl_Position=vec4(p,0.,1.);}`;
const FRAG=`#version 300 es
precision highp float;
uniform vec2 uRes,uC;
uniform float uT,uBass,uTreb,uOn,uX0,uX1,uDesk,uOut;
uniform float uBands[10];
uniform vec4 uSel[8];
uniform int uSelN;
out vec4 o;

/* the vibe on show (see VIBES). uBar is the equaliser's ten bars: the field's
   own colours laid out bass to treble */
uniform vec3 uInk,uHot[8],uDusk[8],uBar[10];

vec3 mod289(vec3 x){return x-floor(x*(1./289.))*289.;}
vec2 mod289(vec2 x){return x-floor(x*(1./289.))*289.;}
vec3 permute(vec3 x){return mod289(((x*34.)+1.)*x);}
float snoise(vec2 v){
  const vec4 C=vec4(.211324865405187,.366025403784439,-.577350269189626,.024390243902439);
  vec2 i=floor(v+dot(v,C.yy));vec2 x0=v-i+dot(i,C.xx);
  vec2 i1=(x0.x>x0.y)?vec2(1.,0.):vec2(0.,1.);
  vec4 x12=x0.xyxy+C.xxzz;x12.xy-=i1;
  i=mod289(i);
  vec3 q=permute(permute(i.y+vec3(0.,i1.y,1.))+i.x+vec3(0.,i1.x,1.));
  vec3 m=max(.5-vec3(dot(x0,x0),dot(x12.xy,x12.xy),dot(x12.zw,x12.zw)),0.);
  m=m*m;m=m*m;
  vec3 x=2.*fract(q*C.www)-1.;vec3 h=abs(x)-.5;vec3 ox=floor(x+.5);vec3 a0=x-ox;
  m*=1.79284291400159-.85373472095314*(a0*a0+h*h);
  vec3 g;g.x=a0.x*x0.x+h.x*x0.y;g.yz=a0.yz*x12.xz+h.yz*x12.yw;
  return 130.*dot(m,g);
}
float fbm(vec2 q){
  float a=.5,s=0.;
  for(int i=0;i<2;i++){s+=a*snoise(q);q=q*2.03+vec2(17.3,9.1);a*=.34;}
  return s;
}
vec3 col(float i,float hot){
  int k=int(mod(i,8.));
  return mix(uDusk[k],uHot[k],hot);
}
void main(){
  float mn=min(uRes.x,uRes.y);
  vec2 uv=(gl_FragCoord.xy-.5*uRes)/mn;
  vec2 q=uv*.56;
  float t=uT;
  /* warp the field with itself once: big slow shapes, not marbling */
  vec2 a=vec2(fbm(q+vec2(0.,t*.55)),fbm(q+vec2(5.2,1.3)-t*.45));
  float f=fbm(q+(.42+.5*uBass)*a+vec2(t*.2,-t*.14));
  /* the mute drop pushes the field outward */
  float d=length((gl_FragCoord.xy-uC)/mn);
  f+=(.3+.5*uBass)*exp(-d*d*9.);
  f+=uTreb*.02*snoise(q*6.+t*4.);
  float v=f*mix(2.8,4.3,uOn)+t*1.1;
  float i=floor(v),e=fract(v);
  float aa=max(fwidth(v),1e-4)*1.1;
  /* Ten columns between uX0 and uX1, one per EQ band. The strip left over, where
     the volume fader stands, is an eleventh: the level going out, so it moves
     with the music and with the fader in front of it. Up to its level a column
     runs hot; above it, it falls back to dusk and sinks toward ink. */
  vec2 st=gl_FragCoord.xy/uRes;
  float inside=step(uX0,st.x)*step(st.x,uX1);
  float fx=(st.x-uX0)/(uX1-uX0)*10.;
  int k=int(clamp(floor(fx),0.,9.));
  float lit=1.-step(mix(uOut,uBands[k],inside),st.y);
  float hot=uOn*lit;
  vec3 c=mix(col(i,hot),col(i+1.,hot),smoothstep(1.-aa,1.,e));
  c=mix(c,uInk,uOn*(1.-lit)*.3);
  /* Selected text is highlighted by the field itself: inside the selection the
     same shapes are cut into many narrow bands and every hot colour races
     through them. It is always hot, sound or no sound. */
  float v2=f*15.+t*10.+(uv.x-uv.y)*5.;
  float i2=floor(v2),a2=max(fwidth(v2),1e-4)*1.1;
  vec3 trip=mix(uHot[1+int(mod(i2,7.))],uHot[1+int(mod(i2+1.,7.))],smoothstep(1.-a2,1.,fract(v2)));
  float sel=0.;
  for(int j=0;j<8;j++){
    if(j>=uSelN)break;
    vec4 r=uSel[j];
    sel=max(sel,step(r.x,st.x)*step(st.x,r.z)*step(r.y,st.y)*step(st.y,r.w));
  }
  c=mix(c,trip,sel);
  /* With the equaliser open the field settles, as on the test card: each band is
     one flat bar of its own colour, bright up to its level and a dark tint of
     itself above. The volume's strip goes plain ink. A hairline parts the bars. */
  vec3 bar=mix(mix(uBar[k],uInk,.76),uBar[k],lit);
  c=mix(c,mix(uInk,bar,inside),uDesk);
  float edge=min(fract(fx),1.-fract(fx))*uRes.x*(uX1-uX0)*.1;
  o=vec4(mix(c,uInk,uDesk*inside*(1.-step(1.6,edge))),1.);
}`;
let prog=null;const U={};
function sh(type,src){
  const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(s));
  return s;
}
if(gl){
  try{
    prog=gl.createProgram();
    gl.attachShader(prog,sh(gl.VERTEX_SHADER,VERT));gl.attachShader(prog,sh(gl.FRAGMENT_SHADER,FRAG));
    gl.linkProgram(prog);
    if(!gl.getProgramParameter(prog,gl.LINK_STATUS))throw new Error(gl.getProgramInfoLog(prog));
    gl.useProgram(prog);
    gl.bindBuffer(gl.ARRAY_BUFFER,gl.createBuffer());
    gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
    const loc=gl.getAttribLocation(prog,"p");

  if(!now.length||was.includes(now[0]))return -1;

     one it held on the near side, the one it holds now on the far side. The

     same way and none ever seen from behind. Seen from as far off, for its

   type, as wide as what is selected on that line and as tall as the line. */
const selRects=new Float32Array(32);

function readSelection(){
  selN=0;

  const range=sel.getRangeAt(0),cr=cv.getBoundingClientRect();
  for(const ln of block.children){
    if(selN>=8)break;

    selRects.set([(x0-cr.left)/cr.width,(cr.bottom-b.bottom-py)/cr.height,

    gl.uniform1f(U.uT,T);gl.uniform1f(U.uBass,bass);gl.uniform1f(U.uTreb,treb);gl.uniform1f(U.uOn,onAmt);
    gl.uniform1f(U.uX0,x0);gl.uniform1f(U.uX1,x1);gl.uniform1f(U.uDesk,deskAmt);gl.uniform1f(U.uOut,out);
    gl.uniform1fv(U.uBands,levels);
    /* the colours run toward the vibe on show */
    for(const k in field){const a=field[k],b=fieldTo[k],m=Math.min(1,dt*6);for(let i=0;i<a.length;i++)a[i]+=(b[i]-a[i])*m;}
    gl.uniform3fv(U.uInk,field.ink);gl.uniform3fv(U.uHot,field.hot);gl.uniform3fv(U.uDusk,field.dusk);gl.uniform3fv(U.uBar,field.bar);
    gl.uniform4fv(U.uSel,selRects);gl.uniform1i(U.uSelN,selN);
    gl.drawArrays(gl.TRIANGLES,0,3);
  }
  const d=blobPath(now/1000,.035+bass*.09,treb*.02);
  bd.setAttribute("d",d);shd.setAttribute("d",d);
  requestAnimationFrame(frame);
}

/* ================= go ================= */
paintEq();paintSound();paintCover();paintHist();
/* straight to the song: wait a beat for the first title before falling back to the station name */
setTimeout(()=>{if(!shown)showTrack();},1500);
(document.fonts&&document.fonts.load?document.fonts.load('900 100px Archivo'):Promise.resolve())
  .catch(()=>{}).then(()=>{widths.clear();bears.clear();build(false);});
let rsTO=null;
new ResizeObserver(()=>{clearTimeout(rsTO);rsTO=setTimeout(()=>{build(false);fitHist();readSelection();},60);}).observe(block);
requestAnimationFrame(frame);
/* on air without being asked, except inside the index page's preview frame */
if(window.self===window.top)radio.autostart();
</script>
