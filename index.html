<!doctype html>
<html lang="en" data-air="off">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Radio Change</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Martian+Mono:wdth,wght@75..112.5,100..800&display=swap" rel="stylesheet" />
<style>
  :root{
    --ink:#1C0836;--cream:#FFF3DC;--amber:#FFC93C;
    --pad:clamp(14px,2.2vw,34px);
    --gap:clamp(14px,2vw,30px);
    --bar:clamp(48px,6.6vh,60px);
    --side:clamp(190px,23vw,330px);
    --volw:44px;
    /* the strip the volume stands in; the ten EQ bands take the rest of the width */
    --gut:calc(var(--pad) + var(--volw) + var(--gap)/2);
    --gl:var(--gut);--gr:0px;
    --ease:cubic-bezier(.7,0,.15,1);
    --mono:"Martian Mono",ui-monospace,Consolas,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  /* The page is one screen and never scrolls. On a phone that has to be said
     three ways: nothing for the document to scroll to, no rubber band past its
     ends, and the page itself pinned to the screen, so it fills whatever the
     browser's bars leave it and stays put under a dragging finger. */
  html{height:100%;overflow:hidden;overscroll-behavior:none;background:var(--ink)}
  body{
    background:var(--ink);color:var(--cream);
    font-family:Archivo,"Arial Narrow",Impact,sans-serif;font-stretch:100%;
    position:fixed;inset:0;overflow:hidden;overscroll-behavior:none;touch-action:pinch-zoom;padding:var(--pad);
    display:grid;column-gap:var(--gap);
    grid-template-columns:var(--volw) minmax(0,1fr) var(--side);
    grid-template-rows:auto minmax(0,1fr) auto;
    -webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none;
  }
  canvas#c{position:absolute;inset:0;width:100%;height:100%;display:block;z-index:0;
    background:linear-gradient(140deg,#1C0836,#2A1AA0 55%,#B0126F)}

  header,#block,#side,#vol,footer{position:relative;z-index:2}
  header,#block,#side,footer{pointer-events:none}
  .hit{pointer-events:auto}
  .pill{background:var(--ink);border-radius:999px}
  .lab{font-weight:800;font-stretch:112%;font-size:10px;letter-spacing:.18em;text-transform:uppercase}

  header{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;
    padding-bottom:calc(var(--pad)*.5);min-height:calc(var(--pad)*.5 + 30px)}
  .wm{font-weight:900;font-stretch:125%;font-size:clamp(15px,1.5vw,22px);letter-spacing:.08em;text-transform:uppercase;
    text-shadow:.07em .07em 0 var(--ink)}
  .st{display:flex;align-items:center;gap:.7em;padding:.75em 1.1em}
  .st i{width:.9em;height:.9em;border-radius:50%;background:var(--cream);opacity:.4}
  [data-air=on] .st i{background:#FF4A3A;opacity:1}
  [data-air=dialing] .st i{opacity:1;animation:blink .35s steps(2,jump-none) infinite}
  body.quiet .st i{background:var(--amber);opacity:1}
  @keyframes blink{50%{opacity:.25}}

  /* ---------- the song: every line set edge to edge ---------- */
  #block{grid-column:2;grid-row:2;min-height:0;display:flex;flex-direction:column;justify-content:flex-end;
    transition:opacity .25s}
  #block.out{opacity:0}
  .ln{position:relative;width:max-content;white-space:nowrap;font-weight:900;line-height:.78;
    clip-path:inset(-25% 100% -25% 0);
    animation:wipe .6s var(--ease) forwards;animation-delay:calc(var(--i)*70ms)}
  #block.still .ln{animation:none;clip-path:none}
  @keyframes wipe{to{clip-path:inset(-25% -6% -25% -2%)}}
  /* artist: cream with a hard ink edge. title: ink with a cream outline.
     Each carries its own light and dark, so both read on any colour behind. */
  .ln.a{color:var(--cream);text-shadow:.03em .03em 0 var(--ink)}
  .ln.t{color:var(--ink);-webkit-text-stroke:.04em var(--cream);paint-order:stroke fill}
  /* Brackets are drawn taller than the capitals, above them and below the line,
     and lines set this tight have no room for that: a size down and lifted, they
     stand as tall as a round letter. The fitting counts on this size (see BRS). */
  .br{font-size:.8em;position:relative;bottom:.14em}
  /* The song can be selected and copied. Its highlight is not a box of colour:
     the field itself runs fast and fine behind whatever is selected (see the
     shader), so here the letters only need to keep their own look. */
  #block{pointer-events:auto}
  .ln{user-select:text;-webkit-user-select:text;cursor:pointer}
  .ln.a::selection,.ln.a .br::selection{background:transparent;color:var(--cream);text-shadow:.03em .03em 0 var(--ink)}
  .ln.t::selection,.ln.t .br::selection{background:transparent;color:var(--ink);-webkit-text-stroke:.04em var(--cream)}
  body.nogl .ln::selection,body.nogl .ln .br::selection{background:#E81E8C}        /* no field to draw it: a plain hot highlight */
  /* the small titles can be selected too */
  ::selection{background:var(--amber);color:var(--ink)}
  #hist li,#np{pointer-events:auto;user-select:text;-webkit-user-select:text;cursor:text}

  /* ---------- right: the cover, and under it the last songs played ---------- */
  #side{grid-column:3;grid-row:2;min-height:0;display:flex;flex-direction:column;gap:12px;overflow:hidden;
    padding:24px 9px 9px 0;margin-top:-24px;transition:opacity .25s}
  .art{--r:16px;--sh:8px;position:relative;flex:none;width:min(100%,38vh);aspect-ratio:1;border-radius:var(--r);overflow:hidden;
    background:var(--ink);box-shadow:var(--sh) var(--sh) 0 var(--ink);container-type:inline-size}
  .art .ph,#actArt .ph{position:absolute;inset:0;display:grid;place-items:center;background:var(--b,#5B2BE0);color:var(--f,#FFE9C9);
    font-weight:900;font-stretch:125%;font-size:62cqw;line-height:1;text-transform:uppercase}
  .art img,#actArt img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  /* A face is what the cover slot shows: the sleeve, or a flat tile with an initial.
     A change of face is a flip. The cover turns side to side like a card on a
     pin through its top and bottom, old on one face and new on the other, to
     come to rest on the new one. How it moves (how far round, the pace, the
     easing, the depth) is set in the script, next to the code that runs it. */
  .face,.flip{position:absolute;inset:0}
  .flip{pointer-events:none;transform-style:preserve-3d;will-change:transform}
  /* while it turns, the card carries its own corners and shadow, and the slot shows nothing of its own */
  .art.flipping{overflow:visible;background:none;box-shadow:none;z-index:1}
  .art.flipping #faceNow{visibility:hidden}
  .side{position:absolute;inset:0;border-radius:var(--r);overflow:hidden;background:var(--ink);
    box-shadow:var(--sh) var(--sh) 0 var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden}
  .side.back{transform:rotateY(180deg)}
  .jp{flex:none;align-self:flex-start;color:var(--amber);padding:.6em .9em;margin-top:2px}
  .jp:has(+ #hist:empty){display:none}
  #hist{position:relative;list-style:none;display:flex;flex-direction:column;gap:7px;min-height:0}
  #hist li{flex:none;display:flex;align-items:center;gap:10px;min-width:0;
    background:var(--ink);border-radius:14px;padding:6px 14px 6px 6px}
  /* A row's picture turns over as the cover does, and its back is never seen.
     The ghost is what the row held before: the old picture and words, standing
     over the same slot with no pill of their own, for the first half of the turn. */
  #hist .th{backface-visibility:hidden;-webkit-backface-visibility:hidden}
  #hist li.ghost{position:absolute;left:0;right:0;pointer-events:none;background:none}
  #hist .th{position:relative;flex:none;width:38px;height:38px;border-radius:9px;overflow:hidden;
    background:var(--b);color:var(--f);display:grid;place-items:center;font-weight:900;font-size:19px;text-transform:uppercase}
  #hist .th img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .4s}
  #hist .th img.on{opacity:1}
  #hist .tx{min-width:0}
  #hist b,#hist span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #hist b{font-weight:800;font-stretch:92%;font-size:13px;line-height:1.15}
  #hist span{font-weight:500;font-size:12px;line-height:1.2;opacity:.8}

  /* ---------- the volume fader ---------- */
  .trk{position:relative;flex:1;width:18px;min-height:70px;border-radius:9px;background:var(--ink)}
  .trk i{position:absolute;left:4px;right:4px;border-radius:5px;background:var(--cream)}
  .trk b{position:absolute;left:50%;width:30px;height:30px;margin-left:-15px;border-radius:50%;
    background:var(--amber);box-shadow:3px 3px 0 var(--ink)}
  .num{min-width:40px;text-align:center;padding:.7em .5em;font-size:11px;letter-spacing:.06em}

  /* volume: upright, the wheel moves it from anywhere, mute sits at its foot */
  #vol{grid-column:1;grid-row:2/4;display:flex;flex-direction:column;align-items:center;gap:10px}
  .fader{flex:1;min-height:0;width:100%;display:flex;flex-direction:column;align-items:center;gap:10px;
    cursor:ns-resize;touch-action:none}
  .fader .trk{max-height:58vh;margin-top:auto}
  .fader .trk i{bottom:4px;height:calc((100% - 8px)*var(--v,.8))}
  .fader .trk b{bottom:calc((100% - 30px)*var(--v,.8))}
  body.quiet .fader .trk i{opacity:.35}
  /* a jump (mute, or a press far along the track) glides; a drag stays under the finger */
  .fader.glide .trk i{transition:height .22s cubic-bezier(.3,.7,.3,1)}
  .fader.glide .trk b{transition:bottom .22s cubic-bezier(.3,.7,.3,1)}
  #mute{position:relative;flex:none;width:var(--bar);height:var(--bar);border:0;background:none;padding:0;cursor:pointer;
    color:var(--ink);display:grid;place-items:center}
  #mute svg{grid-area:1/1}
  #blob{width:100%;height:100%;overflow:visible}
  #blob .sh{fill:var(--ink)}
  #blob .bd{fill:var(--cream);transition:fill .25s}
  #mute:hover .bd{fill:#fff}
  body.quiet #blob .bd{fill:var(--amber)}
  .ic{width:50%;height:50%;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
  .ic .f{fill:currentColor}
  .i-off{display:none}
  body.quiet .i-on{display:none}
  body.quiet .i-off{display:block}
  /* waiting for the first touch: the button breathes, nothing radiates */
  [data-air=blocked] #mute{animation:breathe .8s ease-in-out infinite alternate}
  @keyframes breathe{to{transform:scale(1.14)}}

  /* ---------- footer: presets, and the way into the equaliser ---------- */
  footer{grid-column:2/4;grid-row:3;display:flex;align-items:center;gap:8px;min-width:0;min-height:var(--bar);
    margin-top:calc(var(--pad)*.7)}
  #presets{display:flex;gap:7px;flex-wrap:wrap}
  #presets button{font:inherit;font-weight:800;font-stretch:100%;font-size:11px;letter-spacing:.12em;cursor:pointer;
    background:var(--ink);color:var(--cream);border:0;border-radius:999px;padding:.95em 1.25em;white-space:nowrap}
  #presets button:hover{color:var(--amber)}
  #presets button.act{background:var(--cream);color:var(--ink)}
  #presets button.eq{display:flex;align-items:center;gap:.7em}
  #presets button.eq svg{width:1.25em;height:1.25em;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round}
  body.desk #presets button.eq{background:var(--amber);color:var(--ink)}
  .hint{display:none;padding:.7em 1em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;
    font-family:var(--mono);font-weight:600;font-stretch:87.5%;font-size:11px;letter-spacing:0;text-transform:none}
  body.desk .hint{display:block}
  /* shown only while the browser is holding the sound back; sits beside the mute button */
  #cue{display:none;order:-1;flex:none;background:var(--cream);color:var(--ink);padding:1em 1.4em;
    font-size:12px;letter-spacing:.12em;white-space:nowrap}
  [data-air=blocked] #cue{display:block}

  /* ---------- the equaliser: the ten columns of the field are the sliders ---------- */
  #cols{position:absolute;z-index:3;top:0;bottom:0;left:var(--gl);right:var(--gr);
    display:flex;opacity:0;visibility:hidden;transition:opacity .25s,visibility 0s .25s}
  body.desk #cols{opacity:1;visibility:visible;transition:opacity .25s}
  body.desk #block,body.desk #side{opacity:0;visibility:hidden}
  body.desk header,body.desk footer{z-index:4}        /* keep the presets clickable over the faders */
  /* The test card's slider, as it was: no track and no knob. The bar is the
     slider, with one plain line across it where the band is set and a small tag
     over the line. It works because the bar under it is one flat colour. */
  .col{position:relative;flex:1;min-width:0;cursor:ns-resize;touch-action:none}
  .gain{position:absolute;left:0;right:0;height:4px;margin-top:-2px;background:var(--cream);
    top:calc(50% - var(--g,0)*30%);pointer-events:none}
  /* Read-outs are set in the test card's own face, a monospace: figures line up,
     the zero is unmistakable, and the tag can hug its text. Every band shows its
     value, flat ones included. */
  .tag{position:absolute;left:50%;transform:translateX(-50%);white-space:nowrap;pointer-events:none;
    border-radius:2px;padding:3px 5px;font-family:var(--mono);font-weight:700;font-stretch:87.5%;
    font-size:11px;line-height:1.1;letter-spacing:0;text-transform:none}
  .gain .tag{bottom:8px;background:var(--cream);color:var(--ink);transition:background-color .15s}
  .col.drag .gain .tag{background:var(--amber)}
  .hz{bottom:calc(var(--pad)*1.7 + var(--bar) - 2px);background:var(--ink);color:var(--cream)}
  /* the song steps up into the header while the equaliser has the page */
  #np{display:none;min-width:0;max-width:52%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    padding:.75em 1.2em;font-weight:700;font-stretch:100%;font-size:13px;line-height:1}
  body.desk #np{display:block}

  /* where type is measured, never seen. Fixed, because a song set this big is
     far wider than a phone, and a phone will zoom out to anything the page is
     wide enough to scroll to. */
  /* ---------- the song elsewhere: what a click or a tap on a song brings up ---------- */
  #hist li,.art{cursor:pointer}
  .art{pointer-events:auto}
  /* a card: the song's picture, and beside it the four ways out, in a column as tall as the picture */
  #act{--row:34px;--sp:6px;position:fixed;z-index:8;left:0;top:0;display:flex;gap:8px;padding:8px;
    max-width:calc(100vw - 20px);background:var(--cream);border-radius:22px;box-shadow:6px 6px 0 var(--ink)}
  #act[hidden]{display:none}
  #actArt{position:relative;flex:none;width:calc(var(--row)*4 + var(--sp)*3);aspect-ratio:1;border-radius:15px;overflow:hidden;
    background:var(--ink);container-type:inline-size}
  #act .ways{display:flex;flex-direction:column;gap:var(--sp);min-width:136px}
  #act a,#act button{display:flex;align-items:center;height:var(--row);padding:0 1.5em;
    font:inherit;font-weight:800;font-stretch:100%;font-size:11px;letter-spacing:.12em;
    text-transform:uppercase;text-decoration:none;white-space:nowrap;cursor:pointer;
    background:var(--ink);color:var(--cream);border:0;border-radius:999px}
  #act a:hover,#act button:hover{color:var(--amber)}
  #act button.done{background:var(--amber);color:var(--ink)}
  /* the row it was brought up for, lit the way the chosen preset is */
  #hist li.picked{background:var(--cream);color:var(--ink)}
  #measure{position:fixed;left:0;top:0;visibility:hidden;white-space:nowrap;
    font-size:100px;font-weight:900;line-height:1;pointer-events:none}
  #err{position:fixed;z-index:9;left:50%;top:var(--pad);transform:translateX(-50%);display:none;
    background:var(--amber);color:var(--ink);padding:.8em 1.2em;border-radius:999px;font-weight:800;font-size:12px;letter-spacing:.08em}

  /* a phone: the volume moves to the right */
  @media (max-width:760px){
    :root{--volw:40px;--gl:0px;--gr:var(--gut)}
    body{grid-template-columns:minmax(0,1fr) var(--volw);grid-template-rows:auto minmax(0,1fr) auto auto;row-gap:12px}
    header{padding-bottom:0}
    #block{grid-column:1}
    #side{grid-column:1;grid-row:3;display:grid;grid-template-columns:108px minmax(0,1fr);gap:10px;align-items:start}
    .art{--r:12px;--sh:5px;width:108px}
    .jp{display:none}
    #hist{max-height:108px}
    #vol{grid-column:2;grid-row:2/5}
    footer{grid-column:1;grid-row:4;margin-top:0;flex-wrap:wrap}
    #presets{gap:5px}
    #presets button{padding:.9em .8em;letter-spacing:.05em}
    .hint{display:none!important}
    #cue{flex:1 0 100%;text-align:center}
    .tag{font-size:9px;padding:2px 3px}
    .hz{bottom:auto;top:calc(var(--pad) + 50px)}       /* up top here: a deep cut would land on them below */
    #np{display:none!important}
  }
</style>
</head>
<body>
  <canvas id="c" aria-hidden="true"></canvas>
  <div id="cols" aria-label="Equaliser"></div>

  <header>
    <b class="wm">Radio Change</b>
    <span id="np" class="pill"></span>
    <span class="st pill lab"><i></i><span id="st">On air</span></span>
  </header>

  <div id="vol">
    <div class="fader hit" id="fader" role="slider" aria-label="Volume" aria-orientation="vertical" aria-valuemin="0" aria-valuemax="100">
      <div class="trk"><i></i><b></b></div>
      <span id="volPct" class="num pill lab">80</span>
    </div>
    <button id="mute" class="hit" aria-label="Mute" aria-pressed="false">
      <svg id="blob" viewBox="-120 -120 240 240" aria-hidden="true">
        <path class="sh" transform="translate(9 9)"/><path class="bd"/>
      </svg>
      <svg class="ic i-on" viewBox="0 0 24 24" aria-hidden="true">
        <path class="f" d="M3.5 9.5h3.3L11.5 5.6v12.8L6.8 14.5H3.5z"/>
        <path d="M15 9.3a3.9 3.9 0 0 1 0 5.4M17.6 6.9a7.3 7.3 0 0 1 0 10.2"/>
      </svg>
      <svg class="ic i-off" viewBox="0 0 24 24" aria-hidden="true">
        <path class="f" d="M3.5 9.5h3.3L11.5 5.6v12.8L6.8 14.5H3.5z"/>
        <path d="M15.4 9.4l5.2 5.2M20.6 9.4l-5.2 5.2"/>
      </svg>
    </button>
  </div>

  <main id="block" aria-live="polite"></main>

  <aside id="side">
    <div class="art" id="art" tabindex="0" role="button" aria-haspopup="menu" aria-label="This song elsewhere">
      <div class="face" id="faceNow"></div>
      <div class="flip" id="flip"></div>
    </div>
    <span class="jp pill lab">Just played</span>
    <ol id="hist"></ol>
  </aside>

  <footer>
    <span id="cue" class="pill lab">Sound is off. Click anywhere</span>
    <div id="presets" class="hit"></div>
    <span class="hint pill">Drag a bar up to boost, down to cut. Double-click resets it.</span>
  </footer>

  <div id="act" role="menu" aria-label="This song elsewhere" hidden>
    <div id="actArt" aria-hidden="true"></div>
    <div class="ways">
      <button type="button" role="menuitem" data-do="copy">Copy</button>
      <a role="menuitem" data-do="youtube" target="_blank" rel="noopener">YouTube</a>
      <a role="menuitem" data-do="spotify" target="_blank" rel="noopener">Spotify</a>
      <a role="menuitem" data-do="apple" target="_blank" rel="noopener">Apple Music</a>
    </div>
  </div>

  <div id="measure" aria-hidden="true"></div>
  <div id="err" role="alert"></div>

<script src="engine.js?v=17"></script>
<script>
/* =====================================================================
   RADIO CHANGE
     ground   big flat fluid shapes; hot when sound is running, dusk when not.
              Ten columns are lit to each EQ band's level, and one more, behind
              the volume fader, to the level going out
     song     artist and title stretched edge to edge, cover, last songs played
     sound    no play button: the page goes on air by itself (or on the first
              touch, where the browser insists), and there is only mute
     EQ       presets in the footer; CUSTOM EQ settles the field into ten flat
              bars, the test card's way: each bar is its own slider, with one line
              across it where the band is set
   ===================================================================== */
const $=s=>document.querySelector(s);
const block=$("#block"),meas=$("#measure"),cv=$("#c"),muteBtn=$("#mute");
const NB=radio.NB;
radio.keepAlive=true;               // no play button here, so a lost signal redials itself

/* flat stand-in for a missing cover: two colours and an initial */
const TILES=[["#FF4A1C","#1A1247"],["#FFD21F","#17110F"],["#00A870","#0E1F3D"],["#FF6FAE","#2A0F6B"],
             ["#5B2BE0","#FFE9C9"],["#D8FF3E","#0F3B2C"],["#16B4F2","#2B0B3A"],["#E81E6E","#FFF3D6"]];
function tileFor(text){
  let h=0;for(const c of text)h=(h*31+c.codePointAt(0))>>>0;
  return TILES[h%TILES.length];
}

/* ================= the ground ================= */
const gl=cv.getContext("webgl2",{antialias:false,alpha:false,powerPreference:"high-performance"});
const VERT=`#version 300 es
in vec2 p;void main(){gl_Position=vec4(p,0.,1.);}`;
const FRAG=`#version 300 es
precision highp float;
uniform vec2 uRes,uC;
uniform float uT,uBass,uTreb,uOn,uX0,uX1,uDesk,uOut;
uniform float uBands[10];
uniform vec4 uSel[8];
uniform int uSelN;
out vec4 o;

const vec3 INK=vec3(.110,.031,.212);
const vec3 HOT[8]=vec3[8](
  vec3(.110,.031,.212), vec3(1.,.231,.180), vec3(1.,.541,.118), vec3(1.,.788,.235),
  vec3(.910,.118,.549), vec3(.416,.122,.878), vec3(.071,.188,.784), vec3(0.,.659,.588));
const vec3 DUSK[8]=vec3[8](
  vec3(.110,.031,.212), vec3(.165,.102,.627), vec3(.690,.071,.435), vec3(.165,.102,.627),
  vec3(.110,.031,.212), vec3(.290,.110,.720), vec3(.690,.071,.435), vec3(.165,.102,.627));

vec3 mod289(vec3 x){return x-floor(x*(1./289.))*289.;}

  clearTimeout(tileTO);
  const letter=t?Array.from(t.artist||t.title)[0]:"R";
  const tile=()=>changeFace(makeFace(key,letter,null),key+"|");
  /* The old cover stays up while the new one is looked for. A quick answer goes
     straight from cover to cover; a slow one starts turning to the tile, and if
     the cover turns up before the tile has been seen, lands on the cover. */
  if(!faced||!t)tile();else tileTO=setTimeout(tile,700);
  if(!t)return;
  radio.art(key,600,u=>{
    if(artFor!==key)return;
    if(!u){clearTimeout(tileTO);tile();return;}
    const probe=new Image();
    probe.onload=()=>{if(artFor!==key)return;clearTimeout(tileTO);changeFace(makeFace(key,letter,probe),key+"|"+u);};
    probe.onerror=()=>{if(artFor!==key)return;clearTimeout(tileTO);tile();};
    probe.src=u;
  });
}
/* ---------- just played ----------
   When a song ends it joins the top of the list and everything under it moves
   down one. No row travels, and no row turns over. Once the cover has turned,
   the small pictures do, the same way: the first one, then the second, then the
   third, each to the song that has moved into its row. The words beside a
   picture change as it passes edge on. */
const histEl=$("#hist");
const ROW={duration:200+TURN*2.2,easing:"cubic-bezier(.3,0,.45,1)",fill:"both"},STEP=240;   // one picture's turn, and how long after it the next one starts
/* The words beside a picture change as it first passes edge on, a quarter turn
   in: the old ones are gone by then, and the new ones come up straight after.
   These offsets are measured in turn too. */
const WORDS_OUT=[{opacity:1},{opacity:0,offset:80/TURN},{opacity:0}];
const WORDS_IN=[{opacity:0},{opacity:0,offset:95/TURN},{opacity:1,offset:Math.min(.95,230/TURN)},{opacity:1}];
const PILL_IN=[{opacity:0},{opacity:1,offset:.3},{opacity:1}];   // a row that was not there before
const histRows=()=>Array.from(histEl.children).filter(li=>li.song);
function makeRow(p){
  const li=document.createElement("li"),th=document.createElement("div"),tx=document.createElement("div");
  const tile=tileFor(p.text);
  th.className="th";th.style.setProperty("--b",tile[0]);th.style.setProperty("--f",tile[1]);
  th.textContent=Array.from(p.artist||p.title)[0];
  tx.className="tx";
  const b=document.createElement("b"),s=document.createElement("span");
  b.textContent=p.artist||p.title;s.textContent=p.artist?p.title:"";
  tx.append(b,s);li.append(th,tx);li.title=p.text;li.song=p.text;li.info=p;
  radio.art(p.text,100,u=>{
    if(!u)return;
    const im=new Image();im.alt="";
    im.onload=()=>im.classList.add("on");
    im.src=u;th.append(im);
  });
  return li;
}
/* How a new running order follows from the one on show, when it is the everyday
   step: one song in at the top, and the rows under it down by one, as far as
   row k. Row k itself goes, either off the end or because it is the song now
   playing again, and anything under it stays as it is. -1 for any other change. */
function shiftPlan(was,now){
  if(!now.length||was.includes(now[0]))return -1;
  const rest=now.slice(1);
  let k=0;
  while(k<rest.length&&rest[k]===was[k])k++;
  for(let i=k;i<rest.length;i++)if(rest[i]!==was[i+1])return -1;
  return k;
}
let chain=null;
const spare=new Map();              // rows made ahead of time, so their pictures are in before they turn into view
function endChain(){
  const c=chain;
  if(!c)return;
  chain=null;clearTimeout(c.guard);
  c.anims.forEach(a=>a.cancel());
  c.ghosts.forEach(g=>g.remove());
}
function paintHist(turning){
  endChain();
  const list=radio.played().slice(0,6),old=histRows();
  const was=old.map(li=>li.song),now=list.map(p=>p.text);
  if(was.join("\n")===now.join("\n")){spare.clear();fitHist();return;}
  const k=turning===true&&!calm.matches&&!document.hidden?shiftPlan(was,now):-1;
  /* where each row stands, and whether it shows, before anything changes */
  const stood=old.map(li=>({top:li.offsetTop,seen:li.style.visibility!=="hidden"}));
  /* a song that stays in the list keeps its row, picture and all */
  const rows=list.map(p=>old[was.indexOf(p.text)]||spare.get(p.text)||makeRow(p));
  spare.clear();
  histEl.replaceChildren(...rows);
  fitHist();
  if(k<0)return;
  /* Slots 0 to k have a new song in them. In each, the picture is a card: the
     one it held on the near side, the one it holds now on the far side. The
     sides are separate pictures standing in the same place, each turning the
     same way and none ever seen from behind. Seen from as far off, for its
     size, as the cover is. */
  const c=chain={anims:[],ghosts:[]};
  /* a picture turning, from `from` degrees round; given a pair of opacities, it changes hands as the cover's near side does */
  const turnArt=(th,from,delay,hand)=>{
    const d="perspective("+Math.round(th.offsetWidth*DEPTH)+"px) ",o={...ROW,delay:delay};
    c.anims.push(th.animate([{transform:d+"rotateY("+from+"deg)"},{transform:d+"rotateY("+(from+TURN)+"deg)"}],o));
    if(hand)c.anims.push(th.animate(handOver(TURN-180,hand[0],hand[1]),o));
  };
  const fade=(el,frames,delay)=>c.anims.push(el.animate(frames,{...ROW,delay:delay}));
  /* a copy of a row, standing over a slot with no pill of its own */
  const ghost=(li,top)=>{
    const g=li.cloneNode(true);
    g.className="ghost";g.removeAttribute("title");g.setAttribute("aria-hidden","true");
    g.style.visibility="";g.style.top=top+"px";
    histEl.append(g);c.ghosts.push(g);
    return g;
  };
  rows.forEach((li,j)=>{
    if(j>k||li.style.visibility==="hidden")return;
    const delay=j*STEP,had=old[j]&&stood[j].seen;
    /* what the row held: its picture on the near side, its words until that picture is edge on */
    if(had){
      const g=ghost(old[j],stood[j].top);
      turnArt(g.firstChild,0,delay,ROUND?[1,0]:null);
      fade(g.lastChild,WORDS_OUT,delay);
    }
    /* what it holds now: the picture on the far side, and, when the card comes
       right round, on the near side as well from the hand over on. The row's
       own picture is whichever of the two the card lands on. */
    if(ROUND){
      const far=ghost(li,li.offsetTop);
      far.lastChild.style.visibility="hidden";
      turnArt(far.firstChild,-180,delay);
      turnArt(li.firstChild,0,delay,[0,1]);
    }else turnArt(li.firstChild,-180,delay);
    fade(li.lastChild,WORDS_IN,delay);
    if(!had)fade(li,PILL_IN,delay);
  });
  const over=()=>{if(chain===c)endChain();};
  Promise.all(c.anims.map(a=>a.finished)).then(over,()=>{});
  c.guard=setTimeout(over,ROW.duration+k*STEP+600);   // in case the page is put away and the end is never announced
}
/* never show half a row: hide whatever doesn't fully fit (by where a row sits, not where a turn has it just now) */
function fitHist(){
  const lim=histEl.clientHeight+1;
  for(const li of histRows())li.style.visibility=li.offsetTop+li.offsetHeight>lim?"hidden":"";
}
/* The list waits for the cover. Once the new cover has come to rest, the rows
   under it start to turn. */
let histDue=false,histTO=null;
function dueHist(){histDue=false;clearTimeout(histTO);paintHist(true);}
function faceLanded(){
  if(histDue&&artFor!==null&&shownId.slice(0,artFor.length+1)===artFor+"|")dueHist();
}
function onHistory(){
  const was=histRows().map(li=>li.song),list=radio.played().slice(0,6),t=radio.track;
  /* Only the everyday step waits. Anything else is put right at once, and so is
     a list that still has the song now playing in it: that is never shown twice. */
  if(calm.matches||document.hidden||shiftPlan(was,list.map(p=>p.text))<0||(t&&was.includes(t.text))){dueHist();return;}
  spare.clear();
  list.forEach(p=>{if(!was.includes(p.text))spare.set(p.text,makeRow(p));});
  histDue=true;
  clearTimeout(histTO);histTO=setTimeout(dueHist,5000);   // should no cover come to rest, the list moves anyway
  if(!turn)faceLanded();                                  // the cover is there already
}

/* ================= selecting the song =================
   The shader needs to know where the selection is: one rectangle per line of
   type, as wide as what is selected on that line and as tall as the line. */
const selRects=new Float32Array(32);
let selN=0;
if(!prog)document.body.classList.add("nogl");
function readSelection(){
  selN=0;
  const sel=getSelection();
  if(!sel.rangeCount||sel.isCollapsed)return;
  const range=sel.getRangeAt(0),cr=cv.getBoundingClientRect();
  for(const ln of block.children){
    if(selN>=8)break;
    if(!range.intersectsNode(ln))continue;
    /* the part of the selection that falls on this line */
    const r=document.createRange();r.selectNodeContents(ln);
    if(range.compareBoundaryPoints(Range.START_TO_START,r)>0)r.setStart(range.startContainer,range.startOffset);
    if(range.compareBoundaryPoints(Range.END_TO_END,r)<0)r.setEnd(range.endContainer,range.endOffset);
    let x0=1e9,x1=-1e9;
    for(const q of r.getClientRects()){if(q.width<1)continue;x0=Math.min(x0,q.left);x1=Math.max(x1,q.right);}
    if(x1<=x0)continue;
    const b=ln.getBoundingClientRect(),py=b.height*.03;
    /* as fractions of the page, measured from the bottom left like the shader does */
    selRects.set([(x0-cr.left)/cr.width,(cr.bottom-b.bottom-py)/cr.height,
                  (x1-cr.left)/cr.width,(cr.bottom-b.top+py)/cr.height],selN*4);
    selN++;
  }
}
document.addEventListener("selectionchange",readSelection);
/* the lines are broken for the page, not for pasting: copy gives the song on one
   line, and the whole thing selected gives it properly: Artist - Title */
document.addEventListener("copy",e=>{
  const sel=getSelection();
  if(!sel.rangeCount||sel.isCollapsed||!block.contains(sel.anchorNode)||!block.contains(sel.focusNode))return;
  const flat=sel.toString().replace(/\s+/g," ").trim(),t=radio.track;
  const all=t?((t.artist?t.artist+" ":"")+t.title).replace(/\s+/g," ").trim():"";
  e.clipboardData.setData("text/plain",all&&flat.toLowerCase()===all.toLowerCase()?t.text:flat);
  e.preventDefault();
});

/* ================= the song elsewhere =================
   A click or a tap on a song (the big type, the cover, a row of the list)
   brings up a card: its picture, and beside it four ways out of the page. Copy
   its name, or look it up on YouTube, Spotify or Apple Music. The three are
   searches by name, because a name is all the stream gives. */
const actEl=$("#act"),actArt=$("#actArt");
let actFor=null,actRow=null,swipedAt=-1e9;
function closeAct(){
  if(!actFor)return;
  actFor=null;actEl.hidden=true;
  if(actRow)actRow.classList.remove("picked");
  actRow=null;
}
function openAct(song,x,y,row){
  const q=encodeURIComponent(((song.artist?song.artist+" ":"")+song.title).replace(/\s+/g," ").trim());
  actEl.querySelector("[data-do=youtube]").href="https://www.youtube.com/results?search_query="+q;
  actEl.querySelector("[data-do=spotify]").href="https://open.spotify.com/search/"+q;
  actEl.querySelector("[data-do=apple]").href="https://music.apple.com/search?term="+q;
  const cp=actEl.querySelector("[data-do=copy]");
  cp.textContent="Copy";cp.classList.remove("done");
  actFor=song;actEl.hidden=false;
  /* the picture: the tile at once, the sleeve over it as soon as it is in */
  actArt.replaceChildren(...makeFace(song.text,Array.from(song.artist||song.title)[0],null).childNodes);
  radio.art(song.text,300,u=>{
    if(!u||actFor!==song)return;
    const im=new Image();
    im.alt="";im.onload=()=>{if(actFor===song)actArt.append(im);};
    im.src=u;
  });
  /* a row lights up, and the menu stands clear of it, so it is plain which song is meant */
  actRow=row||null;
  if(row){row.classList.add("picked");y=row.getBoundingClientRect().top+8;}
  /* over the finger if there is room, under it if not, and never off the page */
  const w=actEl.offsetWidth,h=actEl.offsetHeight,m=10;
  actEl.style.left=Math.round(Math.max(m,Math.min(innerWidth-w-m,x-w/2)))+"px";
  actEl.style.top=Math.round(y-h-14>=m?y-h-14:Math.min(innerHeight-h-m,y+18))+"px";
}
/* which song a click landed on: one from the list, or the one on air */
function songAt(el){
  const row=el.closest("#hist li");
  if(row)return row.info||null;
  return el.closest(".ln,#art")?radio.track:null;
}
/* the clipboard the modern way, and where that is missing or refused, the old way */
function copyText(text){
  const old=()=>new Promise((ok,no)=>{
    const ta=document.createElement("textarea");
    ta.value=text;ta.style.cssText="position:fixed;left:-99px;top:0;opacity:0";
    document.body.append(ta);ta.select();
    let done=false;
    try{done=document.execCommand("copy");}catch(e){}
    ta.remove();
    if(done)ok();else no();
  });
  return navigator.clipboard&&window.isSecureContext?navigator.clipboard.writeText(text).catch(old):old();
}
actEl.addEventListener("click",e=>{
  const b=e.target.closest("[data-do]"),song=actFor;
  if(!b||!song)return;
  if(b.dataset.do!=="copy"){setTimeout(closeAct,0);return;}     // a link: the browser is already on its way
  copyText(song.text).then(()=>{b.textContent="Copied";b.classList.add("done");},()=>{b.textContent="Not copied";})
    .then(()=>setTimeout(()=>{if(actFor===song)closeAct();},900));
});
addEventListener("click",e=>{
  if(actEl.contains(e.target))return;
  const song=songAt(e.target),open=actFor;
  closeAct();                                        // a click anywhere else puts it away
  if(!song||(open&&open.text===song.text))return;    // and one on the same song is all that was meant
  /* not the tap that woke the sound, not the end of a drag on the volume, and
     not the end of a selection: that was somebody picking out words */
  const now=performance.now(),sel=getSelection();
  if(now-wokeAt<700||now-swipedAt<400||(sel&&!sel.isCollapsed))return;
  openAct(song,e.clientX,e.clientY,e.target.closest("#hist li"));
});
artEl.addEventListener("keydown",e=>{
  if(e.key!=="Enter"||!radio.track)return;
  const r=artEl.getBoundingClientRect();
  if(actFor)closeAct();else openAct(radio.track,r.left+r.width/2,r.top+r.height/2);
});
addEventListener("keydown",e=>{if(e.key==="Escape")closeAct();});
addEventListener("resize",closeAct);
radio.on("track",closeAct);

/* ================= sound: volume, wheel, mute ================= */
/* mute and zero are one thing in the engine: muting sends the fader to the
   bottom, the bottom of the fader shows as muted */
const fader=$("#fader"),vtrk=fader.querySelector(".trk");
let volShown=radio.volume;
function paintVol(v){
  fader.classList.toggle("glide",Math.abs(v-volShown)>.15);volShown=v;
  fader.style.setProperty("--v",v.toFixed(3));
  fader.setAttribute("aria-valuenow",Math.round(v*100));
  $("#volPct").textContent=Math.round(v*100);
}
radio.on("volume",paintVol);paintVol(radio.volume);
fader.addEventListener("pointerdown",e=>{
  fader.setPointerCapture(e.pointerId);
  const at=ev=>{const r=vtrk.getBoundingClientRect();radio.setVolume(1-(ev.clientY-r.top)/r.height);};
  at(e);
  const up=()=>{fader.removeEventListener("pointermove",at);fader.removeEventListener("pointerup",up);};
  fader.addEventListener("pointermove",at);fader.addEventListener("pointerup",up);
});
/* the page never scrolls, so the wheel is the volume: one notch is 5% */
addEventListener("wheel",e=>{
  e.preventDefault();
  const unit=e.deltaMode===1?.0167:.0005;       // lines vs pixels
  radio.setVolume(radio.volume+Math.max(-.1,Math.min(.1,-e.deltaY*unit)));
},{passive:false});

/* A finger has no wheel, so its drag is the wheel: up for louder, as on the
   fader, from anywhere that is not a control of its own. It takes a clear
   up-or-down move to start, so a tap is still a tap, and it measures from where
   it started, so the volume never jumps.
   On a phone (or anything set up as one) a mouse stands in for the finger: its
   drag does the same, and does not sweep a selection across the big type as it
   would on a desk. Words are still picked out there the phone's way, by a long
   press. */
const phone=matchMedia("(pointer:coarse)");
let swipe=null;
addEventListener("pointerdown",e=>{
  const finger=e.pointerType==="touch"||(phone.matches&&e.button===0);
  swipe=finger&&e.isPrimary&&!e.target.closest("#vol,.col,#presets,#act")
    ?{id:e.pointerId,x:e.clientX,y:e.clientY,v:0,on:false,mouse:e.pointerType!=="touch"}:null;
});
document.addEventListener("selectstart",e=>{if(swipe&&swipe.mouse)e.preventDefault();});
addEventListener("pointermove",e=>{
  if(!swipe||e.pointerId!==swipe.id)return;
  const dx=e.clientX-swipe.x,dy=e.clientY-swipe.y;
  if(!swipe.on){
    if(Math.abs(dx)>24&&Math.abs(dx)>Math.abs(dy)){swipe=null;return;}      // sideways: not ours
    if(Math.abs(dy)<12||Math.abs(dy)<Math.abs(dx)*1.5)return;
    swipe.on=true;swipe.y=e.clientY;swipe.v=radio.volume;
    closeAct();
    return;
  }
  swipedAt=performance.now();
  radio.setVolume(swipe.v-(e.clientY-swipe.y)/(innerHeight*.9));            // most of the screen's height is the whole range
});
["pointerup","pointercancel"].forEach(t=>addEventListener(t,e=>{if(swipe&&e.pointerId===swipe.id)swipe=null;}));

/* The touch that wakes a blocked page must not also count as "mute". These run
   before the engine's own wake-up listeners, so they still see the old state;
   a tap arrives as touchend and then click, hence the short window. */
let wokeAt=-1e9;
["click","touchend","keydown"].forEach(t=>addEventListener(t,()=>{
  if(radio.state==="blocked")wokeAt=performance.now();
},true));
muteBtn.addEventListener("click",()=>{if(performance.now()-wokeAt>700)radio.setMuted(!radio.muted);});

function paintSound(){
  const s=radio.state,quiet=radio.muted||s==="blocked";
  document.body.classList.toggle("quiet",quiet);
  $("#st").textContent=s==="blocked"?"Sound off":s==="dialing"?"Connecting":radio.muted?"Muted":s==="on"?"On air":"Off air";
  muteBtn.setAttribute("aria-pressed",quiet);
  muteBtn.setAttribute("aria-label",quiet?"Turn sound on":"Mute");
}
radio.on("state",paintSound);radio.on("mute",paintSound);
radio.on("track",()=>{paintCover();showTrack();$("#np").textContent=radio.track?radio.track.text:"";});
radio.on("history",onHistory);
radio.on("error",msg=>{
  const e=$("#err");e.textContent=msg;e.style.display="block";
  clearTimeout(e.t);e.t=setTimeout(()=>{e.style.display="none";},6000);
});
if(matchMedia("(pointer:coarse)").matches)$("#cue").textContent="Sound is off. Tap anywhere";

/* ================= the mute drop ================= */
const bd=document.querySelector("#blob .bd"),shd=document.querySelector("#blob .sh");
function blobPath(t,amp,rip){
  const N=64,R=96,pts=[];
  for(let i=0;i<N;i++){
    const th=i/N*6.2832;
    const r=R*(1+amp*(.5*Math.sin(2*th+t*1.1)+.32*Math.sin(3*th-t*1.7+1.3)+.2*Math.sin(5*th+t*2.3))
                 +rip*Math.sin(9*th-t*6));
    pts.push([r*Math.cos(th),r*Math.sin(th)]);
  }
  /* smooth closed curve through the midpoints */
  let d="";
  for(let i=0;i<N;i++){
    const a=pts[i],b=pts[(i+1)%N];
    d+=(i?"Q"+a[0].toFixed(1)+" "+a[1].toFixed(1)+" ":"M")+((a[0]+b[0])/2).toFixed(1)+" "+((a[1]+b[1])/2).toFixed(1)+" ";
  }
  return d+"Q"+pts[0][0].toFixed(1)+" "+pts[0][1].toFixed(1)+" "+
    ((pts[0][0]+pts[1][0])/2).toFixed(1)+" "+((pts[0][1]+pts[1][1])/2).toFixed(1)+"Z";
}

/* ================= frame loop ================= */
let T=Math.random()*40,onAmt=0,deskAmt=0,bass=0,treb=0,out=1,last=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  const s=radio.sample();
  onAmt+=((s.on?1:0)-onAmt)*Math.min(1,dt*1.6);
  deskAmt+=((document.body.classList.contains("desk")?1:0)-deskAmt)*Math.min(1,dt*7);
  bass+=(s.bass-bass)*.25;treb+=(s.treble-treb)*.3;
  T+=dt*(.035+onAmt*(.03+s.level*.3));

  for(let i=0;i<NB;i++){
    let tgt=1,k=dt*4;                                      // no signal: every column fully lit
    if(s.on){tgt=Math.max(.02,Math.min(1,s.bands[i]*1.22));k=dt*(tgt>levels[i]?36:13);}
    levels[i]+=(tgt-levels[i])*Math.min(1,k);
  }
  /* the volume's own column: what is going out, so it answers to the fader and to mute */
  {
    let tgt=1,k=dt*4;
    if(s.on){tgt=radio.muted?0:Math.min(1,s.level*1.7)*Math.pow(radio.volume,.7);k=dt*(tgt>out?30:9);}
    out+=(tgt-out)*Math.min(1,k);
  }
  if(prog){
    const r=muteBtn.getBoundingClientRect(),cr=cv.getBoundingClientRect();
    gl.uniform2f(U.uRes,cv.width,cv.height);
    gl.uniform2f(U.uC,(r.left-cr.left+r.width/2)*scale,(cr.bottom-(r.top+r.height/2))*scale);
    gl.uniform1f(U.uT,T);gl.uniform1f(U.uBass,bass);gl.uniform1f(U.uTreb,treb);gl.uniform1f(U.uOn,onAmt);
    gl.uniform1f(U.uX0,x0);gl.uniform1f(U.uX1,x1);gl.uniform1f(U.uDesk,deskAmt);gl.uniform1f(U.uOut,out);
    gl.uniform1fv(U.uBands,levels);
    gl.uniform4fv(U.uSel,selRects);gl.uniform1i(U.uSelN,selN);
    gl.drawArrays(gl.TRIANGLES,0,3);
  }
  const d=blobPath(now/1000,.035+bass*.09,treb*.02);
  bd.setAttribute("d",d);shd.setAttribute("d",d);
  requestAnimationFrame(frame);
}

/* ================= go ================= */
paintEq();paintSound();paintCover();paintHist();
/* straight to the song: wait a beat for the first title before falling back to the station name */
setTimeout(()=>{if(!shown)showTrack();},1500);
(document.fonts&&document.fonts.load?document.fonts.load('900 100px Archivo'):Promise.resolve())
  .catch(()=>{}).then(()=>{widths.clear();bears.clear();build(false);});
let rsTO=null;
new ResizeObserver(()=>{clearTimeout(rsTO);rsTO=setTimeout(()=>{build(false);fitHist();readSelection();},60);}).observe(block);
requestAnimationFrame(frame);
/* on air without being asked, except inside the index page's preview frame */
if(window.self===window.top)radio.autostart();
</script>
</body>
</html>
