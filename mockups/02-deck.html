<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Radio Change — Deck</title>
<style>
  :root{
    --silver:#b9bcc0;
    --amber:#ffa62b;
    --vu:#efe6d0;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:#070708;
    font-family:"Helvetica Neue",Arial,sans-serif;
    display:grid;place-items:center;overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }
  body::before{
    content:"";position:fixed;inset:0;z-index:0;
    background:radial-gradient(80% 65% at 50% 42%,#1b1d20 0%,#0a0b0c 60%,#040405 100%);
  }

  .deck{
    position:relative;z-index:1;
    width:min(1120px,94vw);
    border-radius:8px;padding:clamp(14px,2vw,24px);
    display:grid;gap:clamp(12px,1.8vw,20px);
    grid-template-rows:auto 1fr auto;
    background:
      repeating-linear-gradient(90deg,rgba(255,255,255,.5) 0 1px,rgba(0,0,0,.06) 1px 3px),
      linear-gradient(#e6e9ec,#b4b9be 22%,#9ba0a6 50%,#c7ccd1 78%,#8e9399);
    box-shadow:
      0 1px 0 rgba(255,255,255,.7) inset,
      0 -2px 0 rgba(0,0,0,.35) inset,
      0 44px 90px -22px rgba(0,0,0,.95),
      0 0 0 1px #2a2c2f;
  }
  .screw{position:absolute;width:9px;height:9px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#f2f4f6,#7e8388 60%,#4a4e52);
    box-shadow:0 0 0 1px rgba(0,0,0,.4);}
  .screw::after{content:"";position:absolute;inset:2px 1px;border-top:1px solid rgba(0,0,0,.55);transform:rotate(28deg)}
  .screw.a{top:9px;left:9px}.screw.b{top:9px;right:9px}
  .screw.c{bottom:9px;left:9px}.screw.d{bottom:9px;right:9px}

  /* ---------- header ---------- */
  .head{display:flex;align-items:baseline;gap:14px;padding:0 6px}
  .word{
    font-size:clamp(13px,1.7vw,19px);font-weight:800;letter-spacing:clamp(3px,.7vw,7px);
    color:#26292c;text-shadow:0 1px 0 rgba(255,255,255,.75);
  }
  .sub{font-size:10px;letter-spacing:3px;color:#5d6267;text-shadow:0 1px 0 rgba(255,255,255,.6)}
  .power{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:9px;letter-spacing:2px;color:#5d6267}
  .led{width:8px;height:8px;border-radius:50%;background:#4b3a20;box-shadow:0 0 0 1px rgba(0,0,0,.5) inset;transition:.35s}
  body.on .led{background:var(--amber);box-shadow:0 0 10px 2px rgba(255,166,43,.8)}

  /* ---------- main row ---------- */
  .main{display:grid;grid-template-columns:1.35fr 1fr;gap:clamp(12px,1.8vw,20px)}

  /* cassette window */
  .window{
    position:relative;border-radius:5px;padding:clamp(14px,2.2vw,26px);
    background:linear-gradient(#101214,#191c1f 45%,#0b0d0f);
    box-shadow:0 0 0 1px #000, 0 6px 16px rgba(0,0,0,.6) inset;
    display:grid;place-items:center;overflow:hidden;
  }
  .window::after{ /* smoked glass sheen */
    content:"";position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(115deg,rgba(255,255,255,.14) 0 18%,transparent 34% 100%);
  }
  .tape{
    position:relative;width:100%;max-width:390px;aspect-ratio:1.62/1;border-radius:6px;
    background:linear-gradient(#2b2e33,#16181b);
    box-shadow:0 0 0 1px #000,0 8px 18px rgba(0,0,0,.7),0 1px 0 rgba(255,255,255,.09) inset;
    display:grid;place-items:center;
  }
  .label{
    position:absolute;top:8%;left:7%;right:7%;height:34%;border-radius:2px;
    background:linear-gradient(#f0ead9,#ded5bd);
    box-shadow:0 1px 0 rgba(255,255,255,.5) inset;
    padding:6px 10px;overflow:hidden;
  }
  .label i{display:block;height:1px;background:#c9b98f;margin:5px 0}
  .label b{font-size:clamp(9px,1.15vw,12px);letter-spacing:2.5px;color:#2f2a1e;font-weight:800}
  .label span{display:block;font-size:clamp(8px,1vw,10px);color:#6a6250;letter-spacing:1px;margin-top:2px}
  .reels{position:absolute;bottom:11%;left:0;right:0;display:flex;justify-content:space-evenly}
  .reel{
    width:clamp(46px,7vw,76px);aspect-ratio:1;border-radius:50%;
    background:radial-gradient(circle,#0a0b0c 0 26%,#43474c 26% 30%,#1c1f22 30% 100%);
    box-shadow:0 0 0 1px #000, 0 0 10px rgba(0,0,0,.7) inset;
    position:relative;
  }
  .reel::before{ /* hub teeth */
    content:"";position:absolute;inset:34%;border-radius:50%;
    background:conic-gradient(#8b9096 0 12deg,#2a2d31 12deg 60deg,#8b9096 60deg 72deg,#2a2d31 72deg 120deg,
      #8b9096 120deg 132deg,#2a2d31 132deg 180deg,#8b9096 180deg 192deg,#2a2d31 192deg 240deg,
      #8b9096 240deg 252deg,#2a2d31 252deg 300deg,#8b9096 300deg 312deg,#2a2d31 312deg 360deg);
  }
  body.on .reel::before{animation:spin 2.4s linear infinite}
  body.on .reel:last-child::before{animation-duration:3.4s}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* VU meters */
  .meters{display:grid;grid-template-rows:1fr auto;gap:clamp(10px,1.6vw,16px)}
  .vu{
    position:relative;border-radius:4px;overflow:hidden;
    background:linear-gradient(var(--vu),#ddd2b6);
    box-shadow:0 0 0 1px #000, 0 4px 10px rgba(0,0,0,.45) inset;
    display:flex;gap:2px;padding:clamp(8px,1.2vw,14px);
  }
  .gauge{flex:1;position:relative}
  .gauge svg{width:100%;height:100%;display:block;overflow:visible}
  .needle{transform-origin:50% 100%;transform:rotate(-38deg);transition:transform .28s cubic-bezier(.3,1.4,.5,1)}
  .gauge b{position:absolute;left:8px;bottom:2px;font-size:8px;letter-spacing:1.5px;color:#7a6f56;font-weight:700}
  .vu::after{content:"";position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(160deg,rgba(255,255,255,.5) 0 22%,transparent 40%)}

  .display{
    border-radius:4px;padding:clamp(9px,1.3vw,14px) clamp(11px,1.5vw,16px);
    background:linear-gradient(#0a0c0d,#141719);
    box-shadow:0 0 0 1px #000,0 4px 10px rgba(0,0,0,.6) inset;
    font-family:"Consolas",monospace;color:#5c4423;transition:color .4s;
    overflow:hidden;white-space:nowrap;
  }
  body.on .display{color:var(--amber);text-shadow:0 0 12px rgba(255,166,43,.55)}
  .display .tag{font-size:9px;letter-spacing:3px;opacity:.7}
  .display .track{font-size:clamp(11px,1.5vw,15px);letter-spacing:1.5px;margin-top:4px}
  body.on .display .track{animation:crawl 14s linear infinite}
  @keyframes crawl{0%,12%{transform:translateX(0)}88%,100%{transform:translateX(calc(-100% + 240px))}}

  /* ---------- transport ---------- */
  .transport{display:flex;align-items:center;gap:clamp(7px,1vw,12px);padding:0 4px}
  .key{
    border:0;cursor:pointer;border-radius:3px;
    width:clamp(46px,6vw,66px);height:clamp(30px,3.6vw,42px);
    background:linear-gradient(#33373b,#191c1f 55%,#101214);
    box-shadow:0 3px 0 #0a0b0c,0 5px 10px rgba(0,0,0,.6),0 1px 0 rgba(255,255,255,.16) inset;
    display:grid;place-items:center;color:#9aa0a6;font-size:13px;
    transition:transform .08s ease,box-shadow .08s ease;
  }
  .key:active{transform:translateY(3px);box-shadow:0 0 0 #0a0b0c,0 2px 5px rgba(0,0,0,.6) inset}
  .key.big{
    width:clamp(104px,15vw,168px);height:clamp(46px,5.6vw,64px);
    background:linear-gradient(#3c4146,#22262a 55%,#14171a);
    box-shadow:0 5px 0 #0a0b0c,0 10px 20px rgba(0,0,0,.7),0 1px 0 rgba(255,255,255,.2) inset;
    color:#e6e9ec;gap:10px;font-size:12px;letter-spacing:3px;
    display:flex;align-items:center;justify-content:center;
  }
  .key.big svg{width:16px;fill:currentColor}
  .key.big .bars{display:none}
  body.on .key.big{color:var(--amber);text-shadow:0 0 10px rgba(255,166,43,.6)}
  body.on .key.big .tri{display:none}
  body.on .key.big .bars{display:block}
  .key.big:active{transform:translateY(5px);box-shadow:0 0 0 #0a0b0c,0 3px 8px rgba(0,0,0,.6) inset}
  .fader{margin-left:auto;display:flex;align-items:center;gap:10px}
  .fader input{width:clamp(80px,13vw,170px);accent-color:#3d4146}
  .fader span{font-size:9px;letter-spacing:2px;color:#5d6267;text-shadow:0 1px 0 rgba(255,255,255,.6)}

  @media (max-width:760px){
    .main{grid-template-columns:1fr}
    .transport{flex-wrap:wrap;justify-content:center}
    .key.big{order:-1;width:100%}
    .fader{margin:6px auto 0}
  }
</style>
</head>
<body>
  <div class="deck">
    <i class="screw a"></i><i class="screw b"></i><i class="screw c"></i><i class="screw d"></i>

    <div class="head">
      <div class="word">RADIO CHANGE</div>
      <div class="sub">STEREO CASSETTE DECK · RC-1</div>
      <div class="power"><i class="led"></i>ON AIR</div>
    </div>

    <div class="main">
      <div class="window">
        <div class="tape">
          <div class="label"><b>SIDE A — ROCK</b><i></i><span>continuous play · no ads</span></div>
          <div class="reels"><div class="reel"></div><div class="reel"></div></div>
        </div>
      </div>

      <div class="meters">
        <div class="vu">
          <div class="gauge">
            <svg viewBox="0 0 120 62" preserveAspectRatio="none">
              <path d="M12 54 A 52 52 0 0 1 76 12" fill="none" stroke="#6b6350" stroke-width="1.5"/>
              <path d="M76 12 A 52 52 0 0 1 108 54" fill="none" stroke="#b03a26" stroke-width="1.5"/>
              <g class="needle" data-needle><line x1="60" y1="58" x2="60" y2="12" stroke="#23201a" stroke-width="1.6"/></g>
              <circle cx="60" cy="58" r="4" fill="#23201a"/>
            </svg>
            <b>L</b>
          </div>
          <div class="gauge">
            <svg viewBox="0 0 120 62" preserveAspectRatio="none">
              <path d="M12 54 A 52 52 0 0 1 76 12" fill="none" stroke="#6b6350" stroke-width="1.5"/>
              <path d="M76 12 A 52 52 0 0 1 108 54" fill="none" stroke="#b03a26" stroke-width="1.5"/>
              <g class="needle" data-needle><line x1="60" y1="58" x2="60" y2="12" stroke="#23201a" stroke-width="1.6"/></g>
              <circle cx="60" cy="58" r="4" fill="#23201a"/>
            </svg>
            <b>R</b>
          </div>
        </div>

        <div class="display">
          <div class="tag">NOW PLAYING</div>
          <div class="track" id="track">MOTORHEAD — ACE OF SPADES</div>
        </div>
      </div>
    </div>

    <div class="transport">
      <button class="key big" id="play">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path class="tri" d="M6 4 L20 12 L6 20 Z"/>
          <g class="bars"><rect x="6" y="4" width="4.5" height="16"/><rect x="13.5" y="4" width="4.5" height="16"/></g>
        </svg>
        <span id="playLabel">PLAY</span>
      </button>
      <button class="key" aria-label="Stop">■</button>
      <button class="key" aria-label="Rewind">◀◀</button>
      <button class="key" aria-label="Forward">▶▶</button>
      <div class="fader"><span>VOLUME</span><input type="range" min="0" max="100" value="72" /></div>
    </div>
  </div>

<script>
  const play = document.getElementById('play');
  const label = document.getElementById('playLabel');
  const needles = document.querySelectorAll('[data-needle]');
  let timer = null;

  function swing(){
    needles.forEach(n => {
      const a = document.body.classList.contains('on')
        ? -34 + Math.random() * 56
        : -38 + Math.random() * 4;
      n.style.transform = `rotate(${a}deg)`;
    });
  }

  play.addEventListener('click', () => {
    const on = document.body.classList.toggle('on');
    label.textContent = on ? 'PAUSE' : 'PLAY';
    clearInterval(timer);
    timer = setInterval(swing, on ? 260 : 1400);
    swing();
  });

  timer = setInterval(swing, 1400);
</script>
</body>
</html>
