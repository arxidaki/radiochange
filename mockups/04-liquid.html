<!doctype html>
<html lang="en" data-air="off">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Radio Change: Liquid</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@200..900&display=swap" rel="stylesheet" />
<style>
  :root{
    --ink:#1C0836;--cream:#FFF3DC;--amber:#FFC93C;
    --d:clamp(170px,38vmin,400px);
    --pad:clamp(16px,2.6vw,40px);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--ink);color:var(--cream);height:100dvh;overflow:hidden;
    font-family:Unbounded,"Arial Black",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}
  canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;
    background:linear-gradient(140deg,#1C0836,#2A1AA0 55%,#B0126F)}

  .wm{position:fixed;z-index:2;left:var(--pad);bottom:calc(var(--pad)*.8);
    font-weight:900;font-size:clamp(50px,12.6vw,214px);line-height:.88;letter-spacing:-.035em;
    text-shadow:.035em .035em 0 var(--ink);pointer-events:none}
  .wm span{display:block}

  .np{position:fixed;z-index:3;left:var(--pad);top:var(--pad);max-width:min(64vw,60ch);
    background:var(--ink);padding:1em 1.4em 1.1em;border-radius:1.6em}
  .lab{display:block;font-weight:700;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--amber);margin-bottom:.6em}
  #artist{display:block;font-weight:800;font-size:clamp(14px,1.5vw,21px);line-height:1.15}
  #title{display:block;font-weight:400;font-size:clamp(12px,1.2vw,16px);line-height:1.25;margin-top:.25em}

  /* ---------- the one action: a drop of oil ---------- */
  #play{position:fixed;z-index:4;width:var(--d);height:var(--d);
    right:clamp(14px,8vw,150px);top:calc(46% - var(--d)/2);
    border:0;background:none;cursor:pointer;color:var(--ink);padding:0;
    display:grid;place-items:center}
  #play svg{grid-area:1/1}
  #blob{width:100%;height:100%;overflow:visible}
  #blob .sh{fill:var(--ink)}
  #blob .bd{fill:var(--cream);transition:fill .3s}
  #play:hover .bd{fill:#fff}
  .ic{width:34%;height:34%;fill:currentColor;transition:opacity .2s}
  .i-stop,.i-dial{opacity:0}
  [data-air=on] .i-play,[data-air=dialing] .i-play{opacity:0}
  [data-air=on] .i-stop{opacity:1}
  [data-air=dialing] .i-dial{opacity:1;animation:blink .35s steps(2,jump-none) infinite}
  @keyframes blink{50%{opacity:.25}}

  .volwrap{position:fixed;z-index:3;right:var(--pad);bottom:var(--pad);display:flex;align-items:center;gap:14px;
    background:var(--ink);padding:.7em 1.3em;border-radius:3em}
  .volwrap .lab{margin:0}
  .vol{position:relative;width:clamp(100px,12vw,170px);height:30px;cursor:ew-resize;touch-action:none}
  .vol::before,.vol i{content:"";position:absolute;left:0;top:50%;height:10px;margin-top:-5px;border-radius:5px}
  .vol::before{right:0;background:rgba(255,243,220,.22)}
  .vol i{width:calc(var(--v,.8)*100%);background:var(--cream)}
  .vol b{position:absolute;top:50%;left:calc(var(--v,.8)*100%);width:22px;height:22px;margin:-11px 0 0 -11px;
    border-radius:50%;background:var(--amber)}

  #err{position:fixed;z-index:9;left:50%;top:var(--pad);transform:translateX(-50%);display:none;
    background:var(--amber);color:var(--ink);padding:.8em 1.2em;border-radius:2em;font-weight:800;font-size:11px;letter-spacing:.08em}

  @media (max-aspect-ratio:1/1){
    #play{right:calc(50% - var(--d)/2);top:calc(40% - var(--d)/2)}
    .volwrap{bottom:auto;top:var(--pad);right:var(--pad)}
    .volwrap .lab{display:none}
    .np{top:auto;bottom:calc(var(--pad)*.8 + 2*.88*clamp(50px,12.6vw,214px) + 18px);max-width:calc(100vw - 2*var(--pad))}
  }
</style>
</head>
<body>
  <canvas id="c" aria-hidden="true"></canvas>

  <div class="np" aria-live="polite">
    <span class="lab" id="npLab">On now</span>
    <span id="artist">&nbsp;</span>
    <span id="title"></span>
  </div>

  <h1 class="wm"><span>Radio</span><span>Change</span></h1>

  <button id="play" aria-label="Play Radio Change">
    <svg id="blob" viewBox="-120 -120 240 240" aria-hidden="true">
      <path class="sh" transform="translate(7 7)"/><path class="bd"/>
    </svg>
    <svg class="ic i-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M7.5 3.5 L21.5 12 L7.5 20.5 Z"/></svg>
    <svg class="ic i-stop" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="5" width="14" height="14" rx="1.5"/></svg>
    <svg class="ic i-dial" viewBox="0 0 24 24" aria-hidden="true"><circle cx="4" cy="12" r="2.6"/><circle cx="12" cy="12" r="2.6"/><circle cx="20" cy="12" r="2.6"/></svg>
  </button>

  <div class="volwrap">
    <span class="lab">Vol</span>
    <div class="vol" id="vol" role="slider" aria-label="Volume" aria-valuemin="0" aria-valuemax="100"><i></i><b></b></div>
  </div>
  <div id="err" role="alert"></div>

<script src="engine.js"></script>
<script>
/* =====================================================================
   LIQUID: a light show in flat colour.
   Big fluid shapes with hard edges, no blur and no gradients. Off air
   they drift in three dusk colours; on air the full palette blooms out
   of the PLAY drop and the bass churns it.
   ===================================================================== */
const $=s=>document.querySelector(s);
const cv=$("#c"),play=$("#play");
const gl=cv.getContext("webgl2",{antialias:false,alpha:false,powerPreference:"high-performance"});

const VERT=`#version 300 es
in vec2 p;void main(){gl_Position=vec4(p,0.,1.);}`;
const FRAG=`#version 300 es
precision highp float;
uniform vec2 uRes,uC;
uniform float uT,uBass,uTreb,uOn;
out vec4 o;

const vec3 HOT[8]=vec3[8](
  vec3(.110,.031,.212), vec3(1.,.231,.180), vec3(1.,.541,.118), vec3(1.,.788,.235),
  vec3(.910,.118,.549), vec3(.416,.122,.878), vec3(.071,.188,.784), vec3(0.,.659,.588));
const vec3 DUSK[8]=vec3[8](
  vec3(.110,.031,.212), vec3(.165,.102,.627), vec3(.690,.071,.435), vec3(.165,.102,.627),
  vec3(.110,.031,.212), vec3(.290,.110,.720), vec3(.690,.071,.435), vec3(.165,.102,.627));

vec3 mod289(vec3 x){return x-floor(x*(1./289.))*289.;}
vec2 mod289(vec2 x){return x-floor(x*(1./289.))*289.;}
vec3 permute(vec3 x){return mod289(((x*34.)+1.)*x);}
float snoise(vec2 v){
  const vec4 C=vec4(.211324865405187,.366025403784439,-.577350269189626,.024390243902439);
  vec2 i=floor(v+dot(v,C.yy));vec2 x0=v-i+dot(i,C.xx);
  vec2 i1=(x0.x>x0.y)?vec2(1.,0.):vec2(0.,1.);
  vec4 x12=x0.xyxy+C.xxzz;x12.xy-=i1;
  i=mod289(i);
  vec3 q=permute(permute(i.y+vec3(0.,i1.y,1.))+i.x+vec3(0.,i1.x,1.));
  vec3 m=max(.5-vec3(dot(x0,x0),dot(x12.xy,x12.xy),dot(x12.zw,x12.zw)),0.);
  m=m*m;m=m*m;
  vec3 x=2.*fract(q*C.www)-1.;vec3 h=abs(x)-.5;vec3 ox=floor(x+.5);vec3 a0=x-ox;
  m*=1.79284291400159-.85373472095314*(a0*a0+h*h);
  vec3 g;g.x=a0.x*x0.x+h.x*x0.y;g.yz=a0.yz*x12.xz+h.yz*x12.yw;
  return 130.*dot(m,g);
}
float fbm(vec2 q){
  float a=.5,s=0.;
  for(int i=0;i<2;i++){s+=a*snoise(q);q=q*2.03+vec2(17.3,9.1);a*=.34;}
  return s;
}
vec3 col(float i){
  int k=int(mod(i,8.));
  return mix(DUSK[k],HOT[k],uOn);
}
void main(){
  float mn=min(uRes.x,uRes.y);
  vec2 uv=(gl_FragCoord.xy-.5*uRes)/mn;
  vec2 q=uv*.56;
  float t=uT;
  /* warp the field with itself once: big slow shapes, not marbling */
  vec2 a=vec2(fbm(q+vec2(0.,t*.55)),fbm(q+vec2(5.2,1.3)-t*.45));
  float f=fbm(q+(.42+.5*uBass)*a+vec2(t*.2,-t*.14));
  /* the drop pushes rings out into the field */
  float d=length((gl_FragCoord.xy-uC)/mn);
  f+=(.45+.6*uBass)*exp(-d*d*6.);
  f+=uTreb*.02*snoise(q*6.+t*4.);
  float v=f*mix(2.8,4.3,uOn)+t*1.1;
  float i=floor(v),e=fract(v);
  float aa=max(fwidth(v),1e-4)*1.1;
  o=vec4(mix(col(i),col(i+1.),smoothstep(1.-aa,1.,e)),1.);
}`;

let prog=null,U={};
function sh(type,src){
  const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(s));
  return s;
}
if(gl){
  try{
    prog=gl.createProgram();
    gl.attachShader(prog,sh(gl.VERTEX_SHADER,VERT));gl.attachShader(prog,sh(gl.FRAGMENT_SHADER,FRAG));
    gl.linkProgram(prog);
    if(!gl.getProgramParameter(prog,gl.LINK_STATUS))throw new Error(gl.getProgramInfoLog(prog));
    gl.useProgram(prog);
    gl.bindBuffer(gl.ARRAY_BUFFER,gl.createBuffer());
    gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
    const loc=gl.getAttribLocation(prog,"p");
    gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
    ["uRes","uC","uT","uBass","uTreb","uOn"].forEach(n=>{U[n]=gl.getUniformLocation(prog,n);});
  }catch(e){console.error(e);prog=null;}
}

let scale=1;
function size(){
  /* crisp edges matter more than density: cap the pixel count */
  scale=Math.min(devicePixelRatio||1,1.5);
  const px=cv.clientWidth*cv.clientHeight*scale*scale;
  if(px>3.2e6)scale*=Math.sqrt(3.2e6/px);
  cv.width=Math.round(cv.clientWidth*scale);cv.height=Math.round(cv.clientHeight*scale);
  if(gl)gl.viewport(0,0,cv.width,cv.height);
}
new ResizeObserver(size).observe(cv);size();

/* ---------------- the drop ---------------- */
const bd=document.querySelector("#blob .bd"),shd=document.querySelector("#blob .sh");
function blobPath(t,amp,rip){
  const N=64,R=96,pts=[];
  for(let i=0;i<N;i++){
    const th=i/N*6.2832;
    const r=R*(1+amp*(.5*Math.sin(2*th+t*1.1)+.32*Math.sin(3*th-t*1.7+1.3)+.2*Math.sin(5*th+t*2.3))
                 +rip*Math.sin(9*th-t*6));
    pts.push([r*Math.cos(th),r*Math.sin(th)]);
  }
  /* smooth closed curve through the midpoints */
  let d="";
  for(let i=0;i<N;i++){
    const a=pts[i],b=pts[(i+1)%N],mx=(a[0]+b[0])/2,my=(a[1]+b[1])/2;
    d+=(i?"Q"+a[0].toFixed(1)+" "+a[1].toFixed(1)+" ":"M")+mx.toFixed(1)+" "+my.toFixed(1)+" ";
  }
  const a=pts[0];
  return d+"Q"+a[0].toFixed(1)+" "+a[1].toFixed(1)+" "+((pts[0][0]+pts[1][0])/2).toFixed(1)+" "+((pts[0][1]+pts[1][1])/2).toFixed(1)+"Z";
}

/* ---------------- frame loop ---------------- */
let T=Math.random()*40,onAmt=0,bass=0,treb=0,last=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  const s=radio.sample();
  onAmt+=((s.on?1:0)-onAmt)*Math.min(1,dt*1.6);
  bass+=(s.bass-bass)*.25;treb+=(s.treble-treb)*.3;
  T+=dt*(.035+onAmt*(.03+s.level*.3));

  if(prog){
    const r=play.getBoundingClientRect();
    gl.uniform2f(U.uRes,cv.width,cv.height);
    gl.uniform2f(U.uC,(r.left+r.width/2)*scale,(cv.clientHeight-(r.top+r.height/2))*scale);
    gl.uniform1f(U.uT,T);gl.uniform1f(U.uBass,bass);gl.uniform1f(U.uTreb,treb);gl.uniform1f(U.uOn,onAmt);
    gl.drawArrays(gl.TRIANGLES,0,3);
  }
  const d=blobPath(now/1000,.03+bass*.1,treb*.02);
  bd.setAttribute("d",d);shd.setAttribute("d",d);
  requestAnimationFrame(frame);
}

/* ---------------- wiring ---------------- */
function paintTrack(){
  const t=radio.track;
  $("#npLab").textContent=radio.state==="on"?"Now playing":"On now";
  $("#artist").textContent=t?(t.artist||t.title):"Rock, 24 hours, no ads";
  $("#title").textContent=t&&t.artist?t.title:"";
}
radio.on("state",s=>{
  play.setAttribute("aria-label",s==="off"?"Play Radio Change":"Stop");
  paintTrack();
});
radio.on("track",paintTrack);paintTrack();
radio.on("error",msg=>{
  const e=$("#err");e.textContent=msg;e.style.display="block";
  clearTimeout(e.t);e.t=setTimeout(()=>{e.style.display="none";},6000);
});
play.addEventListener("click",()=>radio.toggle());

const volEl=$("#vol");
function paintVol(v){volEl.style.setProperty("--v",v.toFixed(3));volEl.setAttribute("aria-valuenow",Math.round(v*100));}
radio.on("volume",paintVol);paintVol(radio.volume);
volEl.addEventListener("pointerdown",e=>{
  volEl.setPointerCapture(e.pointerId);
  const at=ev=>{const r=volEl.getBoundingClientRect();radio.setVolume((ev.clientX-r.left)/r.width);};
  at(e);
  const up=()=>{volEl.removeEventListener("pointermove",at);volEl.removeEventListener("pointerup",up);};
  volEl.addEventListener("pointermove",at);volEl.addEventListener("pointerup",up);
});

requestAnimationFrame(frame);
</script>
</body>
</html>
