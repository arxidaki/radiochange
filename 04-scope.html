<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Radio Change — Scope</title>
<style>
  :root{
    --phos:#65ff9d;
    --dim:#0f3b26;
    --bg:#040705;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg);color:var(--phos);
    font-family:"Consolas","SF Mono",monospace;
    overflow:hidden;display:grid;place-items:center;
  }
  /* CRT bloom + vignette */
  .crt{position:fixed;inset:0;z-index:6;pointer-events:none;
    background:radial-gradient(70% 62% at 50% 50%,transparent 40%,rgba(0,0,0,.75) 100%);}
  .scan{position:fixed;inset:0;z-index:7;pointer-events:none;opacity:.42;
    background:repeating-linear-gradient(180deg,rgba(0,0,0,.55) 0 1px,transparent 1px 3px);}
  .flick{position:fixed;inset:0;z-index:8;pointer-events:none;background:var(--phos);
    opacity:.014;animation:flick 4.2s steps(2) infinite;mix-blend-mode:screen}
  @keyframes flick{0%,96%{opacity:.012}97%{opacity:.05}98%{opacity:.008}}

  .rig{position:relative;z-index:2;width:min(940px,92vw);display:grid;gap:clamp(14px,2.4vw,26px)}

  /* ---------- header rail ---------- */
  .rail{
    display:flex;align-items:center;gap:clamp(10px,2vw,22px);
    font-size:clamp(9px,1.15vw,12px);letter-spacing:clamp(2px,.5vw,5px);
    text-transform:uppercase;color:#3f8f63;
    border-bottom:1px solid var(--dim);padding-bottom:10px;
  }
  .rail .call{color:var(--phos);font-weight:700;letter-spacing:clamp(4px,1vw,9px)}
  .rail .stat{margin-left:auto;display:flex;align-items:center;gap:8px}
  .dot{width:7px;height:7px;border-radius:50%;background:#1d4b33;transition:.35s}
  body.on .dot{background:var(--phos);box-shadow:0 0 12px 3px rgba(101,255,157,.8)}

  /* ---------- scope face ---------- */
  .face{
    position:relative;border-radius:10px;overflow:hidden;
    aspect-ratio:2.1/1;
    background:
      linear-gradient(rgba(101,255,157,.03),transparent 40%),
      radial-gradient(60% 70% at 50% 50%,#07130d 0%,#040906 70%,#020403 100%);
    box-shadow:0 0 0 1px var(--dim),0 0 60px rgba(101,255,157,.07) inset;
  }
  .grat{position:absolute;inset:0;pointer-events:none;opacity:.5;
    background-image:
      linear-gradient(var(--dim) 1px,transparent 1px),
      linear-gradient(90deg,var(--dim) 1px,transparent 1px);
    background-size:calc(100%/10) calc(100%/6);}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block}

  /* ---------- the one action ---------- */
  .play{
    position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    width:clamp(112px,15vw,164px);aspect-ratio:1;border-radius:50%;
    background:rgba(4,10,7,.55);backdrop-filter:blur(1px);
    border:2px solid var(--phos);color:var(--phos);cursor:pointer;
    display:grid;place-items:center;
    box-shadow:0 0 24px rgba(101,255,157,.35),0 0 60px rgba(101,255,157,.14) inset;
    transition:transform .18s cubic-bezier(.2,.9,.3,1.3),box-shadow .25s;
  }
  .play:hover{box-shadow:0 0 40px rgba(101,255,157,.6),0 0 80px rgba(101,255,157,.22) inset}
  .play:active{transform:translate(-50%,-50%) scale(.94)}
  .play svg{width:34%;fill:currentColor}
  .play .bars{display:none}
  body.on .play .tri{display:none}
  body.on .play .bars{display:block}
  .play::after{
    content:"";position:absolute;inset:-14px;border-radius:50%;border:1px solid rgba(101,255,157,.35);
  }
  body.on .play::after{animation:ping 2.4s ease-out infinite}
  @keyframes ping{
    0%{transform:scale(1);opacity:.6}100%{transform:scale(1.55);opacity:0}
  }

  /* ---------- footer readout ---------- */
  .foot{
    display:flex;flex-wrap:wrap;gap:6px clamp(14px,2.6vw,30px);align-items:baseline;
    font-size:clamp(10px,1.3vw,14px);letter-spacing:clamp(1px,.3vw,3px);
    border-top:1px solid var(--dim);padding-top:12px;color:#3f8f63;text-transform:uppercase;
  }
  .foot b{color:var(--phos);font-weight:400;letter-spacing:2px}
  .cursor{display:inline-block;width:.55em;height:1em;background:var(--phos);
    vertical-align:-.12em;animation:blink 1.05s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}

  @media (max-width:640px){ .face{aspect-ratio:1.05/1} .rail{flex-wrap:wrap} }
</style>
</head>
<body>
  <div class="crt"></div><div class="scan"></div><div class="flick"></div>

  <div class="rig">
    <div class="rail">
      <span class="call">RADIO CHANGE</span>
      <span>ROCK</span><span>128 KBPS</span>
      <span class="stat"><i class="dot"></i><span id="state">STANDBY</span></span>
    </div>

    <div class="face">
      <div class="grat"></div>
      <canvas id="scope"></canvas>
      <button class="play" id="play" aria-label="Play Radio Change">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path class="tri" d="M6 4 L20 12 L6 20 Z"/>
          <g class="bars"><rect x="6" y="4" width="4.5" height="16"/><rect x="13.5" y="4" width="4.5" height="16"/></g>
        </svg>
      </button>
    </div>

    <div class="foot">
      <span>NOW&nbsp;PLAYING</span>
      <b id="track">QUEENS OF THE STONE AGE — NO ONE KNOWS</b>
      <span class="cursor"></span>
    </div>
  </div>

<script>
  const cv = document.getElementById('scope');
  const ctx = cv.getContext('2d');
  const play = document.getElementById('play');
  const state = document.getElementById('state');
  let playing = false, t = 0, mx = 0.5, energy = 0;

  function size(){
    const r = cv.getBoundingClientRect(), d = window.devicePixelRatio || 1;
    cv.width = r.width * d; cv.height = r.height * d;
    ctx.setTransform(d, 0, 0, d, 0, 0);
  }
  window.addEventListener('resize', size);

  cv.parentElement.addEventListener('pointermove', e => {
    const r = cv.getBoundingClientRect();
    mx = (e.clientX - r.left) / r.width;
  });

  function draw(){
    const r = cv.getBoundingClientRect(), w = r.width, h = r.height, mid = h / 2;
    ctx.clearRect(0, 0, w, h);
    energy += ((playing ? 1 : 0.06) - energy) * 0.05;

    // three phosphor traces at decreasing intensity = beam persistence
    for (let pass = 2; pass >= 0; pass--){
      ctx.beginPath();
      const amp = mid * (0.16 + energy * 0.62) * (1 - pass * 0.22);
      for (let x = 0; x <= w; x += 2){
        const p = x / w;
        const wobble = Math.sin(p * 14 + t * 0.9 + pass) * Math.sin(p * 3.1 - t * 0.4);
        const spike  = Math.sin(p * 47 + t * 3.3) * 0.35 * energy;
        const focus  = Math.exp(-Math.pow((p - mx) * 3.2, 2));
        const noise  = (Math.sin(p * 211 + t * 9) + Math.sin(p * 97 - t * 6)) * 0.05;
        const y = mid + (wobble + spike + noise) * amp * (0.6 + focus * 0.9);
        x === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
      }
      ctx.strokeStyle = `rgba(101,255,157,${[0.95, 0.32, 0.14][pass]})`;
      ctx.lineWidth = [1.6, 4, 9][pass];
      ctx.shadowBlur = [8, 18, 30][pass];
      ctx.shadowColor = 'rgba(101,255,157,.7)';
      ctx.stroke();
    }
    ctx.shadowBlur = 0;
    t += playing ? 0.05 : 0.012;
    requestAnimationFrame(draw);
  }

  play.addEventListener('click', () => {
    playing = !playing;
    document.body.classList.toggle('on', playing);
    state.textContent = playing ? 'ON AIR' : 'STANDBY';
  });

  size(); draw();
</script>
</body>
</html>
