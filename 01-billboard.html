<!doctype html>
<html lang="en" data-air="off">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Radio Change: Billboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap" rel="stylesheet" />
<style>
  /* registered so a palette swap animates everywhere at once */
  @property --bg{syntax:"<color>";inherits:true;initial-value:#1238E8}
  @property --fg{syntax:"<color>";inherits:true;initial-value:#F5EFE0}
  @property --ac{syntax:"<color>";inherits:true;initial-value:#FF4A1C}
  :root{
    --pad:clamp(14px,2.2vw,34px);
    --bar:clamp(50px,7vh,66px);
    --ease:cubic-bezier(.7,0,.15,1);
    transition:--bg .7s var(--ease),--fg .7s var(--ease),--ac .7s var(--ease);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg);color:var(--fg);
    font-family:Archivo,"Arial Narrow",Impact,sans-serif;font-stretch:100%;
    height:100dvh;overflow:hidden;display:grid;
    grid-template-rows:auto minmax(0,1fr) auto;grid-template-columns:minmax(0,1fr);
    -webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none;
  }

  header{display:flex;justify-content:space-between;align-items:center;
    padding:var(--pad) var(--pad) calc(var(--pad)*.5)}
  .wm{font-weight:900;font-stretch:125%;font-size:clamp(15px,1.5vw,22px);letter-spacing:.08em;text-transform:uppercase;
    transition:opacity .4s}
  [data-air=off] .wm{opacity:0}
  .st{display:flex;align-items:center;gap:.7em;font-weight:800;font-stretch:112%;
    font-size:clamp(11px,1vw,14px);letter-spacing:.18em;text-transform:uppercase}
  .st i{width:.85em;height:.85em;border-radius:50%;background:var(--fg);opacity:.35}
  [data-air=on] .st i{background:var(--ac);opacity:1;animation:blink 1.4s steps(2,jump-none) infinite}
  [data-air=dialing] .st i{opacity:1;animation:blink .35s steps(2,jump-none) infinite}
  @keyframes blink{50%{opacity:.25}}

  /* ---------- the block: every line set edge to edge ---------- */
  #block{position:relative;margin:0 var(--pad);min-height:0;
    display:flex;flex-direction:column;justify-content:flex-end;transition:opacity .2s}
  #block.out{opacity:0}
  .ln{position:relative;width:max-content;white-space:nowrap;font-weight:900;line-height:.78;
    clip-path:inset(-25% 100% -25% 0);
    animation:wipe .6s var(--ease) forwards;animation-delay:calc(var(--i)*70ms)}
  #block.still .ln{animation:none;clip-path:none}
  @keyframes wipe{to{clip-path:inset(-25% -4% -25% 0)}}
  .ln .base{display:block}
  /* title lines are outline only; the fill is painted over the inner half of
     the stroke so a variable font's overlapping contours never show */
  .ln.t .base{color:var(--bg);-webkit-text-stroke:.04em var(--fg);paint-order:stroke fill}
  /* the lit copy: each line is a level meter clipped to its own letters */
  .ln .lit{position:absolute;left:0;top:0;color:var(--ac);
    clip-path:inset(-25% calc((1 - var(--l,0))*100%) -25% 0)}

  /* ---------- the one action ---------- */
  #play{
    position:fixed;z-index:5;border:0;border-radius:50%;cursor:pointer;
    background:var(--ac);color:var(--bg);display:grid;place-items:center;
    --d:var(--pd,clamp(150px,28vmin,310px));width:var(--d);height:var(--d);
    left:var(--px,calc(100vw - var(--d) - var(--pad)));
    top:var(--py,calc(100dvh - var(--d) - 16vh));
    transform:scale(var(--k,1));
    transition:left .6s var(--ease),top .6s var(--ease),width .6s var(--ease),height .6s var(--ease);
  }
  [data-air=on] #play,[data-air=dialing] #play{
    --d:var(--bar);left:var(--pad);top:calc(100dvh - var(--pad) - var(--bar));
  }
  #play:hover{filter:brightness(1.08)}
  #play svg{grid-area:1/1;width:42%;height:42%;fill:currentColor;transition:opacity .2s}
  #play .i-stop,#play .i-dial{opacity:0}
  [data-air=on] #play .i-play,[data-air=dialing] #play .i-play{opacity:0}
  [data-air=on] #play .i-stop{opacity:1}
  [data-air=dialing] #play .i-dial{opacity:1;animation:blink .35s steps(2,jump-none) infinite}
  #play::after{content:"";position:absolute;inset:0;border-radius:50%;border:3px solid var(--ac);
    animation:ping 2.4s cubic-bezier(.2,.6,.3,1) infinite;pointer-events:none}
  [data-air=on] #play::after,[data-air=dialing] #play::after{display:none}
  @keyframes ping{from{transform:scale(1);opacity:.9}to{transform:scale(1.45);opacity:0}}

  /* ---------- footer ---------- */
  footer{display:flex;align-items:center;gap:clamp(12px,1.8vw,26px);min-width:0;
    padding:calc(var(--pad)*.7) var(--pad) var(--pad);
    transition:padding-left .6s var(--ease)}
  [data-air=on] footer,[data-air=dialing] footer{
    padding-left:calc(var(--pad) + var(--bar) + clamp(12px,1.6vw,22px))}
  .vol{position:relative;flex:none;width:clamp(110px,13vw,190px);height:var(--bar);
    cursor:ew-resize;touch-action:none}
  .vol::before{content:"";position:absolute;left:0;right:0;top:50%;height:30px;margin-top:-15px;
    clip-path:polygon(0 100%,100% 0,100% 100%);
    background:linear-gradient(90deg,var(--fg) calc(var(--v,.8)*100%),color-mix(in srgb,var(--fg) 26%,transparent) 0)}
  .lab{flex:none;font-weight:800;font-stretch:112%;font-size:11px;letter-spacing:.18em;text-transform:uppercase;opacity:.75}
  .side{display:flex;align-items:center;gap:12px;min-width:0;flex:1;justify-content:flex-end}
  #teaser{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    font-weight:800;font-stretch:88%;font-size:clamp(13px,1.3vw,18px);text-transform:uppercase;letter-spacing:.02em}
  #trail{list-style:none;display:none;gap:8px;min-width:0;overflow:hidden}
  #trail li{flex:0 1 auto;min-width:0;max-width:24ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    background:var(--b);color:var(--f);border:2px solid var(--fg);padding:.6em .8em;
    font-weight:800;font-stretch:88%;font-size:clamp(11px,1vw,14px);text-transform:uppercase;letter-spacing:.02em}
  [data-air=on] #trail{display:flex}
  [data-air=on] #teaser{display:none}

  #measure{position:absolute;left:0;top:0;visibility:hidden;white-space:nowrap;
    font-size:100px;font-weight:900;line-height:1;pointer-events:none}
  #err{position:fixed;z-index:9;left:50%;top:var(--pad);transform:translateX(-50%);display:none;
    background:var(--fg);color:var(--bg);padding:.7em 1em;font-weight:800;font-size:12px;letter-spacing:.1em}

  @media (max-width:720px){
    #trail li:nth-child(n+2){display:none}
    .lab{display:none}
  }
</style>
</head>
<body>
  <header>
    <b class="wm">Radio Change</b>
    <span class="st"><i></i><span id="st">Off air</span></span>
  </header>

  <main id="block" aria-live="polite"></main>

  <footer>
    <div class="vol" id="vol" role="slider" aria-label="Volume" aria-valuemin="0" aria-valuemax="100"></div>
    <div class="side">
      <span class="lab" id="sideLab">On now</span>
      <div id="teaser">&nbsp;</div>
      <ol id="trail"></ol>
    </div>
  </footer>

  <button id="play" aria-label="Play Radio Change">
    <svg class="i-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3.5 L21 12 L7 20.5 Z"/></svg>
    <svg class="i-stop" viewBox="0 0 24 24" aria-hidden="true"><rect x="4.5" y="4.5" width="15" height="15"/></svg>
    <svg class="i-dial" viewBox="0 0 24 24" aria-hidden="true"><circle cx="4" cy="12" r="2.6"/><circle cx="12" cy="12" r="2.6"/><circle cx="20" cy="12" r="2.6"/></svg>
  </button>

  <div id="measure" aria-hidden="true"></div>
  <div id="err" role="alert"></div>

<script src="engine.js"></script>
<script>
/* =====================================================================
   BILLBOARD: the song is the page.
   Every line is fitted to the full width by stretching the letterforms
   (the font's width axis), and each line is a level meter for one slice
   of the spectrum. Every track gets its own colours.
   ===================================================================== */
const $=s=>document.querySelector(s);
const root=document.documentElement,block=$("#block"),meas=$("#measure"),play=$("#play");

const STATION={bg:"#1238E8",fg:"#F5EFE0",ac:"#FF4A1C"};
const PALS=[
  {bg:"#FF4A1C",fg:"#1A1247",ac:"#FFE45C"},
  {bg:"#FFD21F",fg:"#17110F",ac:"#F5234A"},
  {bg:"#00A870",fg:"#0E1F3D",ac:"#FFF3D0"},
  {bg:"#FF6FAE",fg:"#2A0F6B",ac:"#D8FF3E"},
  {bg:"#5B2BE0",fg:"#FFE9C9",ac:"#FF8A00"},
  {bg:"#D8FF3E",fg:"#0F3B2C",ac:"#FF4A1C"},
  {bg:"#16B4F2",fg:"#2B0B3A",ac:"#FFF06A"},
  {bg:"#F2EDE2",fg:"#1238E8",ac:"#FF4A1C"},
  {bg:"#E81E6E",fg:"#FFF3D6",ac:"#1B1464"},
];
function palFor(text){
  let h=0;for(const c of text)h=(h*31+c.codePointAt(0))>>>0;
  return PALS[h%PALS.length];
}
function applyPal(p){
  root.style.setProperty("--bg",p.bg);root.style.setProperty("--fg",p.fg);root.style.setProperty("--ac",p.ac);
}

/* ---------------- fitting ---------------- */
const LH=.78,SMIN=62,SMAX=125;     // line-height, and the font's width-axis range
const TRACK={a:0,t:.034};           // em; outline lines get air so their strokes don't collide
const widths=new Map();
function mw(str,stretch,kind){     // width of str at 100px
  const k=stretch+kind+str;
  let v=widths.get(k);
  if(v===undefined){
    meas.style.fontStretch=stretch+"%";meas.style.letterSpacing=TRACK[kind]+"em";meas.textContent=str;
    v=meas.getBoundingClientRect().width;widths.set(k,v);
  }
  return v;
}
/* cap height and baseline, per 100px, to seat PLAY on a line of type */
let FM={cap:69,asc:88,desc:21};
function readMetrics(){
  const c=document.createElement("canvas").getContext("2d");
  c.font='900 100px Archivo';
  const m=c.measureText("H");
  if(m.actualBoundingBoxAscent>20&&m.fontBoundingBoxAscent)
    FM={cap:m.actualBoundingBoxAscent,asc:m.fontBoundingBoxAscent,desc:m.fontBoundingBoxDescent};
}
/* The advance box is wider than the ink: letters carry side bearings. To set
   lines truly edge to edge we need the ink. Canvas can measure it, but only at
   the named widths, so sample those and interpolate. All per 100px. */
const KW=[[62.5,"extra-condensed"],[75,"condensed"],[87.5,"semi-condensed"],
          [100,"normal"],[112.5,"semi-expanded"],[125,"expanded"]];
const mctx=document.createElement("canvas").getContext("2d");
const bears=new Map();
function bearAt(ch,kw,side){
  const k=ch+kw+side;
  let v=bears.get(k);
  if(v===undefined){
    mctx.font="900 "+kw+" 100px Archivo";
    const m=mctx.measureText(ch);
    v=side==="l"?-m.actualBoundingBoxLeft:m.width-m.actualBoundingBoxRight;
    bears.set(k,v);
  }
  return v;
}
function bearing(ch,stretch,side){
  let i=0;while(i<KW.length-2&&stretch>KW[i+1][0])i++;
  const a=KW[i],b=KW[i+1],f=Math.min(1,Math.max(0,(stretch-a[0])/(b[0]-a[0])));
  return bearAt(ch,a[1],side)*(1-f)+bearAt(ch,b[1],side)*f;
}
const OUT=2;                       // an outline's stroke reaches this far past the letter
function lead(l,st){return bearing(l.first,st,"l")-(l.k==="t"?OUT:0);}
function ink(l,st){                // visible width of a line
  return mw(l.t,st,l.k)-lead(l,st)-(bearing(l.last,st,"r")-(l.k==="t"?OUT:0))-TRACK[l.k]*100;
}
/* break words into n lines, keeping the widest line as narrow as possible */
function breakInto(words,n,kind){
  const w=words.map(x=>mw(x,SMIN,kind)),sp=mw("A A",SMIN,kind)-mw("AA",SMIN,kind);
  let best=null;
  (function rec(start,left,acc,maxw){
    if(left===1){
      let lw=sp*(words.length-start-1);for(let i=start;i<words.length;i++)lw+=w[i];
      const m=Math.max(maxw,lw);
      if(!best||m<best.m)best={m:m,lines:acc.concat(words.slice(start).join(" "))};
      return;
    }
    let lw=-sp;
    for(let end=start+1;end<=words.length-(left-1);end++){
      lw+=w[end-1]+sp;
      if(best&&lw>=best.m)break;
      rec(end,left-1,acc.concat(words.slice(start,end).join(" ")),Math.max(maxw,lw));
    }
  })(0,n,[],0);
  return best.lines;
}
function compose(artist,title,W,H,notch){
  const aw=artist.split(/\s+/).filter(Boolean),tw=title.split(/\s+/).filter(Boolean);
  const aN=aw.length?[1,2,3].filter(n=>n<=aw.length):[0];
  const tN=tw.length?[1,2,3,4].filter(n=>n<=tw.length):[0];
  let best=null;
  for(const a of aN)for(const b of tN){
    if(!a&&!b)continue;
    const ls=(a?breakInto(aw,a,"a"):[]).map(t=>({t:t,k:"a"}))
      .concat((b?breakInto(tw,b,"t"):[]).map(t=>({t:t,k:"t"})));
    ls.forEach((l,i)=>{
      const ch=Array.from(l.t);
      l.first=ch[0];l.last=ch[ch.length-1];l.n=ch.length;
      /* off air the last line shares its row with PLAY, a circle one cap-height wide */
      l.pad=notch&&i===ls.length-1?FM.cap+9:0;
      l.w0=ink(l,SMIN)+l.pad;l.w1=ink(l,SMAX)+l.pad;
    });
    /* each line fills the width at any size between lo (widest letters) and hi (narrowest) */
    const lo=ls.map(l=>100*W/l.w1),hi=ls.map(l=>100*W/l.w0);
    const sum=v=>v.reduce((x,y)=>x+y,0)*LH;
    let sz;
    if(sum(lo)<=H){
      /* room to spare: grow every line toward its narrow end until the page is full */
      const k=sum(hi)<=H?1:(H-sum(lo))/(sum(hi)-sum(lo));
      sz=lo.map((v,i)=>v+k*(hi[i]-v));
    }else{
      /* too tall: cap the biggest lines, which then fall short of the edge */
      let c0=0,c1=Math.max.apply(null,lo);
      for(let i=0;i<24;i++){const c=(c0+c1)/2;if(sum(lo.map(v=>Math.min(v,c)))>H)c1=c;else c0=c;}
      sz=lo.map(v=>Math.min(v,c0));
    }
    /* best split: most ink on the page, with a mild taste for even line heights */
    let area=0;
    ls.forEach((l,i)=>{l.s=sz[i];area+=Math.min(W,l.w1*l.s/100)*l.s;});
    const score=area/(1+.12*(Math.max.apply(null,sz)/Math.min.apply(null,sz)-1));
    if(!best||score>best.score)best={score:score,ls:ls};
  }
  const ls=best.ls;
  ls.forEach(l=>{
    const need=100*W/l.s-l.pad;      // the 100px ink width that fills the line
    l.ls=0;
    if(l.w1-l.pad<=need){
      l.st=SMAX;
      l.ls=Math.min(.1*l.s,(need-(l.w1-l.pad))*l.s/100/Math.max(1,l.n-1));
    }else if(l.w0-l.pad>=need)l.st=SMIN;
    else{
      let lo=SMIN,hi=SMAX;
      for(let i=0;i<10;i++){const mid=(lo+hi)/2;if(ink(l,mid)<need)lo=mid;else hi=mid;}
      l.st=lo;
    }
    l.ml=-lead(l,l.st)*l.s/100;      // pull the first letter's ink to the edge
  });
  return ls;
}

/* ---------------- the block ---------------- */
let lits=[],shown=null,swapTO=null;
function build(animate){
  const W=block.clientWidth,H=block.clientHeight;
  if(!shown||W<40||H<40)return;
  const ls=compose(shown.a.toLocaleUpperCase(),shown.t.toLocaleUpperCase(),W,H,shown.station);
  block.classList.toggle("still",!animate);
  block.textContent="";lits=[];
  ls.forEach((l,i)=>{
    const d=document.createElement("div");
    d.className="ln "+l.k;
    d.style.cssText="--i:"+i+";font-size:"+l.s.toFixed(1)+"px;font-stretch:"+l.st.toFixed(1)+
      "%;letter-spacing:calc("+TRACK[l.k]+"em + "+l.ls.toFixed(2)+"px);margin-left:"+l.ml.toFixed(1)+"px";
    const base=document.createElement("span");base.className="base";base.textContent=l.t;
    const lit=document.createElement("span");lit.className="lit";lit.textContent=l.t;
    lit.setAttribute("aria-hidden","true");
    d.append(base,lit);block.append(d);
    /* top line listens to the low end, bottom line to the top end */
    const band=ls.length>1?Math.round(1+i*(7/(ls.length-1))):3;
    lits.push({el:lit,v:0,band:band});
  });
  if(shown.station){
    /* seat PLAY on the last line's cap height, flush to the right edge */
    const end=ls[ls.length-1],d=FM.cap*end.s/100;
    const r=block.lastElementChild.getBoundingClientRect(),br=block.getBoundingClientRect();
    const capTop=r.top+(LH*end.s-(FM.asc+FM.desc)*end.s/100)/2+(FM.asc-FM.cap)*end.s/100;
    play.style.setProperty("--pd",d.toFixed(1)+"px");
    play.style.setProperty("--px",(br.right-d).toFixed(1)+"px");
    play.style.setProperty("--py",capTop.toFixed(1)+"px");
  }
}
function show(a,t,pal,animate,station){
  shown={a:a,t:t,station:!!station};
  clearTimeout(swapTO);
  const go=()=>{applyPal(pal);build(animate);block.classList.remove("out");};
  if(animate){block.classList.add("out");swapTO=setTimeout(go,210);}else go();
}
function showStation(animate){show("Radio","Change",STATION,animate,true);}
function showTrack(animate){
  const t=radio.track;
  if(!t)show("Radio Change","Live",STATION,animate);
  else show(t.artist||"Radio Change",t.title,palFor(t.text),animate);
}

/* ---------------- wiring ---------------- */
function renderSide(){
  const t=radio.track;
  $("#teaser").textContent=t?t.text:"Rock, 24 hours, no ads";
  const ol=$("#trail");ol.textContent="";
  const past=radio.played().slice(0,4);
  past.forEach(p=>{
    const li=document.createElement("li"),pal=palFor(p.text);
    li.textContent=p.text;li.title=p.text;
    li.style.setProperty("--b",pal.bg);li.style.setProperty("--f",pal.fg);
    ol.append(li);
  });
  $("#sideLab").textContent=radio.state==="on"?(past.length?"Just played":""):"On now";
}
radio.on("state",s=>{
  $("#st").textContent=s==="on"?"On air":s==="dialing"?"Dialing":"Off air";
  play.setAttribute("aria-label",s==="off"?"Play Radio Change":"Stop");
  if(s==="on")showTrack(true);
  if(s==="off")showStation(true);
  renderSide();
});
radio.on("track",()=>{renderSide();if(radio.state==="on")showTrack(true);});
radio.on("history",renderSide);
radio.on("error",msg=>{
  const e=$("#err");e.textContent=msg;e.style.display="block";
  clearTimeout(e.t);e.t=setTimeout(()=>{e.style.display="none";},6000);
});
play.addEventListener("click",()=>radio.toggle());

/* volume */
const volEl=$("#vol");
function paintVol(v){volEl.style.setProperty("--v",v.toFixed(3));volEl.setAttribute("aria-valuenow",Math.round(v*100));}
radio.on("volume",paintVol);paintVol(radio.volume);
volEl.addEventListener("pointerdown",e=>{
  volEl.setPointerCapture(e.pointerId);
  const at=ev=>{const r=volEl.getBoundingClientRect();radio.setVolume((ev.clientX-r.left)/r.width);};
  at(e);
  const up=()=>{volEl.removeEventListener("pointermove",at);volEl.removeEventListener("pointerup",up);};
  volEl.addEventListener("pointermove",at);volEl.addEventListener("pointerup",up);
});

/* ---------------- frame loop: the type is the meter ---------------- */
let kick=0;
function frame(){
  const s=radio.sample();
  for(const L of lits){
    const tgt=s.on?.03+.97*Math.pow(s.bandsN[L.band],1.6):0;
    L.v+=(tgt-L.v)*(tgt>L.v?.45:.1);
    L.el.style.setProperty("--l",L.v.toFixed(3));
  }
  kick=s.beat?1:kick*.86;
  play.style.setProperty("--k",(1+(s.on?kick*.1:0)).toFixed(3));
  requestAnimationFrame(frame);
}

/* fit once the real font is in, and again whenever the page changes size */
showStation(false);renderSide();
(document.fonts&&document.fonts.load?document.fonts.load('900 100px Archivo'):Promise.resolve())
  .catch(()=>{}).then(()=>{widths.clear();bears.clear();readMetrics();build(false);});
let rsTO=null;
new ResizeObserver(()=>{clearTimeout(rsTO);rsTO=setTimeout(()=>build(false),60);}).observe(block);
requestAnimationFrame(frame);
</script>
</body>
</html>
